let opened = false;
function openDeed() {
  if (opened) return;
  opened = true;
  document.getElementById("deed").classList.add("opened");
  count();
  setYear(2026);
}
function count() {
  const el = document.getElementById("cap");
  const t0 = performance.now();
  const tick = (now) => {
    const p = Math.min(1, (now - t0) / 1200);
    el.textContent = Math.round(105 * (1 - Math.pow(1 - p, 3)));
    if (p < 1) requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
}
function setYear(y) {
  document.getElementById("yrlab").textContent = y;
  document.getElementById("yrbox").textContent = years[y] || years[Math.max(...Object.keys(years).filter(k => k <= y))];
}
function openStory(id) {
  const s = stories[id];
  if (!s) return;
  const box = document.getElementById("scroll");
  if (s.mail) {
    box.innerHTML = `<button class="close" onclick="closeD()">CLOSE · ESC</button>
      <div class="tag">${s.tag}</div><h2>${s.title}</h2>
      <div class="item"><span class="need">要办</span><br><b>sofiapintos190</b> · Supabase：HUST Nursing Platform 闲置超 7 天，将被暂停。</div>
      <div class="item"><span class="need">要办</span><br><b>aimfllyys</b> · SCI-AIChat-Demo master：ci（lint/tsc/vitest）和 security-audit 都红了。</div>
      <div class="item"><span class="need">要办</span><br><b>aimfllyys</b> · llm-agent.cc：8 月 20–26 日暂停开票，要发票得在 20 日前交。</div>
      <div class="item"><b>aimfllyys</b> · Amazon Quick 试用 6 天后结束（约 8 月 24 日）。</div>
      <div class="item"><b>aimfllyys</b> · GitHub 新 PAT「Grok-Bot」已创建。确认是你本人。</div>
      <div class="item"><b>两个账号</b> · Cursor Ultra / Grok Bot / Suno 促销，可略过。</div>`;
  } else {
    const links = (s.src||[]).map(([n,u]) => `<div><a href="${u}" target="_blank" rel="noopener">${n}</a></div>`).join("");
    box.innerHTML = `<button class="close" onclick="closeD()">CLOSE · ESC</button>
      <div class="tag">${s.tag}</div><h2>${s.title}</h2>
      <p>${s.body}</p><div class="why">${s.why}</div><div class="src">${links}</div>`;
  }
  document.getElementById("overlay").classList.add("on");
}
function closeD(){ document.getElementById("overlay").classList.remove("on"); }

document.getElementById("deed").addEventListener("click", e => {
  if (!opened) { openDeed(); return; }
  const t = e.target.closest("[data-id]");
  if (t) openStory(t.dataset.id);
});
document.getElementById("yr").addEventListener("input", e => setYear(e.target.value));
document.getElementById("mailbtn").addEventListener("click", () => openStory("mail"));
document.getElementById("overlay").addEventListener("click", e => { if (e.target.id === "overlay") closeD(); });
window.addEventListener("keydown", e => {
  if (e.key === " " && !opened) { e.preventDefault(); openDeed(); }
  if (e.key === "Escape") closeD();
  if (e.key === "m" || e.key === "M") openStory("mail");
  if ("1234567".includes(e.key)) { if (!opened) openDeed(); openStory(e.key); }
});
</script>
