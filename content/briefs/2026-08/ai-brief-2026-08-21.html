.cm{display:grid;grid-template-columns:28px 1fr;gap:8px;padding:10px 0;border-top:1px solid var(--line)}

/* agent */
.agent{background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column}

.atabs{display:flex;gap:4px;padding:8px}

.atabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.atabs button small{display:block;font-size:10px;opacity:.65;margin-top:1px}
.term{flex:1;overflow:auto;margin:0 8px 8px;background:var(--term);color:var(--termink);

.term .flag{display:inline-block;border:1px solid #7f1d1d;color:var(--danger);

/* note chip */
.note{position:fixed;left:12px;bottom:12px;z-index:8;width:248px;text-align:left;

.prow{display:grid;grid-template-columns:92px 64px 1fr;gap:8px;padding:9px 14px;border-bottom:1px solid var(--line);text-decoration:none;color:inherit}

.sheet{width:min(820px,100%);background:var(--panel);border:1px solid var(--line);border-radius:10px;

.footbar{position:fixed;right:16px;bottom:10px;z-index:4;font-size:10.5px;color:var(--mute2);

@media (max-width:1100px){

}

function stClass(s){ return s.replace(/\s+/g,""); }
function av(who){ return (who && who[0]) || "·"; }

function renderList(){
  const box = $("#ilist");
  let rows = [];
  if(filter === "active"){
    rows = ISSUES.map((it,i)=>({kind:"issue", it, i}));
  } else {
    rows = ARCHIVE.map((a,i)=>({kind:"arch", a, i}));
  }
  if(cursor >= rows.length) cursor = Math.max(0, rows.length-1);
  box.innerHTML = rows.map((r,i)=>{
    const on = i===cursor ? " on" : "";
    if(r.kind==="issue"){
      const it = r.it;
      return `<button type="button" class="iss${on}" data-i="${i}" data-id="${it.id}">
        <span class="id">${it.id}</span>
        <span class="st"><span class="stt ${stClass(it.status)}"><i></i>${it.status}</span>
        <span class="pri ${it.pri}">${it.pri}</span></span>
        <span class="tt">${esc(it.title)}</span>
      </button>`;
    }
    const a = r.a;
    return `<button type="button" class="iss${on}" data-i="${i}" data-arch="${i}">
      <span class="id">${a[1]}</span>
      <span class="st"><span class="t">${esc(a[0])}</span></span>
      <span class="tt">${esc(a[2])}</span>
    </button>`;
  }).join("");
}

    const href = m.href ? `<div class="act"><a href="${m.href}" target="_blank" rel="noopener">${m.href}</a></div>` : "";
    return `<div class="wo">
      <div class="hd"><span class="pill pri ${m.tag==="Urgent"?"Urgent":m.tag==="High"?"High":"Low"}">${m.tag}</span>
        <span class="mono" style="font-size:11px;color:var(--mute)">${m.id}</span>
        <span class="mono" style="font-size:11px;color:var(--mute)">${m.t} · ${m.acct}</span>
      </div>
      <b>${esc(m.title)}</b>
      <p style="margin-top:6px">${esc(m.body)}</p>
      <div class="act"><em style="font-style:normal;font-weight:550">交接 · </em>${esc(m.act)}</div>
      ${href}
    </div>`;
  }).join("");
  $("#mailInner").innerHTML = `<button class="close" type="button">关闭</button>
    <div class="k">Work items · due-date · not an inbox</div>
    <h2>便条 · 羽升删除是急件</h2>
    <p>NVIDIA 日报、Docker、通讯稿已抽走，不占工单。Cursor Auto 08-24 计价昨日已记。</p>
    ${html}
    <p class="foot">2026-08-21 北京时间 · 折晓 早报</p>`;
  $("#ovMail").classList.add("show");
}

function esc(s){
  return String(s).replace(/[&<>"']/g, c=>({ "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;" }[c]));
}

function move(d){
  const n = filter==="active" ? ISSUES.length : ARCHIVE.length;
  cursor = (cursor + d + n) % n;
  renderList();
  const el = $(`.iss[data-i="${cursor}"]`);
  if(el) el.scrollIntoView({block:"nearest"});
}
function openCursor(){
  if(filter==="active") renderIssue(ISSUES[cursor].id);
  else renderArch(cursor);
}

$("#ilist").addEventListener("click", e=>{
  const b = e.target.closest(".iss"); if(!b) return;
  cursor = Number(b.dataset.i);
  if(b.dataset.id) renderIssue(b.dataset.id);
  else renderArch(Number(b.dataset.arch));
});
$$(".filters button").forEach(b=>b.addEventListener("click", ()=>{
  filter = b.dataset.f;
  $$(".filters button").forEach(x=>x.classList.toggle("on", x===b));
  cursor = 0;
  renderList();
  if(filter==="active") renderIssue(ISSUES[0].id);
  else renderArch(0);
}));
$$(".atabs button").forEach(b=>b.addEventListener("click", ()=>{
  agentRun = b.dataset.run; renderAgent();
}));
$("#btnPulse").addEventListener("click", openPulse);
$("#btnNum").addEventListener("click", ()=>{ filter="active"; cursor=0; $$(".filters button").forEach(x=>x.classList.toggle("on", x.dataset.f==="active")); renderList(); renderIssue("ZXO-214"); });
$("#btnPal").addEventListener("click", openPal);
$("#note").addEventListener("click", openMail);
$("#palQ").addEventListener("input", e=>{ palIdx=0; renderPal(e.target.value); });
document.addEventListener("click", e=>{
  if(e.target.classList.contains("close")) closeOv();
});
$$(".ov").forEach(o=>o.addEventListener("click", e=>{ if(e.target===o) closeOv(); }));

document.addEventListener("keydown", e=>{
  const pal = $("#ovPal").classList.contains("show");
  const ov = $$(".ov").some(o=>o.classList.contains("show"));
  if(e.key==="Escape"){ closeOv(); return; }
  if(pal){
    const q = $("#palQ").value;
    const n = ARCHIVE.filter(a => !q.trim() || (a[0]+a[1]+a[2]+a[3]+a[5]).toLowerCase().includes(q.trim().toLowerCase())).length;
    if(e.key==="ArrowDown" || e.key==="j"){ e.preventDefault(); palIdx=Math.min(n-1, palIdx+1); renderPal(q); }
    if(e.key==="ArrowUp" || e.key==="k"){ e.preventDefault(); palIdx=Math.max(0, palIdx-1); renderPal(q); }
    if(e.key==="Enter"){ const a = $("#palRows .prow.on"); if(a) a.click(); }
    return;
  }
  if(ov) return;
  if(e.key==="/" && !/input|textarea/i.test(e.target.tagName)){ e.preventDefault(); openPal(); return; }
  if(e.key==="j"){ e.preventDefault(); move(1); }
  if(e.key==="k"){ e.preventDefault(); move(-1); }
  if(e.key==="Enter"){ e.preventDefault(); openCursor(); }
  if(e.key==="p" && !e.metaKey && !e.ctrlKey){ openPulse(); }
});

renderList();
renderIssue(ISSUES[0].id);
renderAgent();

</script>
</body>
</html>
