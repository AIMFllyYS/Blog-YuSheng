<svg width="640" height="170" viewBox="0 0 640 170" xmlns="http://www.w3.org/2000/svg">
<rect id="original-paper-backplate" x="0" y="0" width="640" height="170" fill="#ffffff"/>
  <text x="160" y="20" text-anchor="middle" font-family="Noto Serif CJK SC" font-weight="700" font-size="12" fill="#a83c1f">目标模式失控：芝诺乌龟式拆分</text>
  <line x1="40" y1="100" x2="300" y2="100" stroke="#cfc9b8" stroke-width="1"/>
  <circle cx="60" cy="100" r="5" fill="#a83c1f"/><text x="60" y="120" font-size="8.5" text-anchor="middle" font-family="Noto Sans CJK SC">拆3步</text>
  <circle cx="150" cy="100" r="4" fill="#a83c1f"/><text x="150" y="120" font-size="8.5" text-anchor="middle" font-family="Noto Sans CJK SC">再拆2步</text>
  <circle cx="220" cy="100" r="3" fill="#a83c1f"/><text x="220" y="120" font-size="8.5" text-anchor="middle" font-family="Noto Sans CJK SC">再拆…</text>
  <text x="270" y="103" font-size="14" fill="#a83c1f">?</text>
  <text x="160" y="150" text-anchor="middle" font-size="9" fill="#a83c1f" font-family="Noto Sans CJK SC">永远觉得"还差一点"，永远到不了终点</text>

  <text x="480" y="20" text-anchor="middle" font-family="Noto Serif CJK SC" font-weight="700" font-size="12" fill="#0a4f4f">渐进模式：小步 + 验收</text>
  <line x1="360" y1="100" x2="620" y2="100" stroke="#cfc9b8" stroke-width="1"/>
  <circle cx="380" cy="100" r="5" fill="#0e6f6e"/><rect x="372" y="112" width="16" height="6" fill="#0e6f6e"/>
  <circle cx="440" cy="100" r="5" fill="#0e6f6e"/><rect x="432" y="112" width="16" height="6" fill="#0e6f6e"/>
  <circle cx="500" cy="100" r="5" fill="#0e6f6e"/><rect x="492" y="112" width="16" height="6" fill="#0e6f6e"/>
  <circle cx="560" cy="100" r="5" fill="#0e6f6e"/><rect x="552" y="112" width="16" height="6" fill="#0e6f6e"/>
  <circle cx="610" cy="100" r="6" fill="#c97a24"/>
  <text x="490" y="150" text-anchor="middle" font-size="9" fill="#0a4f4f" font-family="Noto Sans CJK SC">每次一个简单功能，验收通过再继续</text>
</svg>
