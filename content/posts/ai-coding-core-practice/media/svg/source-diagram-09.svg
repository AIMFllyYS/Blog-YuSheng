<svg width="640" height="150" viewBox="0 0 640 150" xmlns="http://www.w3.org/2000/svg">
<rect id="original-paper-backplate" x="0" y="0" width="640" height="150" fill="#ffffff"/>
  <g font-family="Noto Sans CJK SC" font-size="10">
    <text x="140" y="20" text-anchor="middle" fill="#a83c1f" font-weight="700">从零手写</text>
    <rect x="60" y="30" width="160" height="90" fill="#f7e6de" stroke="#a83c1f" stroke-width="1.2"/>
    <text x="140" y="80" text-anchor="middle" fill="#a83c1f" font-size="16" font-weight="700">5~7 万行</text>
    <text x="140" y="98" text-anchor="middle" fill="#a83c1f">每个功能重写 N 遍</text>

    <text x="480" y="20" text-anchor="middle" fill="#0a4f4f" font-weight="700">引入组件库 / SDK</text>
    <rect x="420" y="90" width="120" height="30" fill="#dcebe9" stroke="#0e6f6e" stroke-width="1.2"/>
    <text x="480" y="110" text-anchor="middle" fill="#0a4f4f" font-size="14" font-weight="700">几百行</text>
    <text x="486" y="70" text-anchor="start" fill="#0a4f4f" font-size="9">富文本渲染组件库</text>
    <text x="486" y="55" text-anchor="start" fill="#0a4f4f" font-size="9">评论 / 登录 SDK</text>
    <text x="486" y="40" text-anchor="start" fill="#0a4f4f" font-size="9">一次接入，处处复用</text>
    <g stroke="#0e6f6e" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M410,67 L413,70 L419,63" transform="translate(0,0)"/>
      <path d="M410,52 L413,55 L419,48" transform="translate(0,0)"/>
      <path d="M410,37 L413,40 L419,33" transform="translate(0,0)"/>
    </g>
  </g>
</svg>
