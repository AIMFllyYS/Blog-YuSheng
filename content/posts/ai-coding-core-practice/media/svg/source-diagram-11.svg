<svg width="640" height="150" viewBox="0 0 640 150" xmlns="http://www.w3.org/2000/svg">
<rect id="original-paper-backplate" x="0" y="0" width="640" height="150" fill="#ffffff"/>
  <g font-family="Noto Sans CJK SC" font-size="10">
    <text x="150" y="20" text-anchor="middle" fill="#a83c1f" font-weight="700">MCP</text>
    <rect x="60" y="30" width="60" height="20" fill="#f7e6de" stroke="#a83c1f"/><text x="90" y="44" text-anchor="middle" font-size="8">首次接入</text>
    <rect x="60" y="55" width="60" height="60" fill="#f7e6de" stroke="#a83c1f"/><text x="90" y="88" text-anchor="middle" font-size="8">每次调用<tspan x="90" dy="12">重复发送</tspan><tspan x="90" dy="12">说明文档</tspan></text>
    <text x="90" y="132" text-anchor="middle" fill="#a83c1f" font-size="9">token 消耗大且持续</text>

    <text x="480" y="20" text-anchor="middle" fill="#0a4f4f" font-weight="700">Skills</text>
    <rect x="420" y="30" width="60" height="20" fill="#dcebe9" stroke="#0e6f6e"/><text x="450" y="44" text-anchor="middle" font-size="8">name+desc</text>
    <rect x="420" y="55" width="60" height="20" fill="#dcebe9" stroke="#0e6f6e"/><text x="450" y="69" text-anchor="middle" font-size="8">按需调用</text>
    <rect x="500" y="30" width="60" height="45" fill="#dcebe9" stroke="#0e6f6e"/><text x="530" y="55" text-anchor="middle" font-size="8">同时挂载<tspan x="530" dy="10">100+ 个</tspan></text>
    <text x="490" y="100" text-anchor="middle" fill="#0a4f4f" font-size="9">数量增加，消耗不显著增加</text>
  </g>
</svg>
