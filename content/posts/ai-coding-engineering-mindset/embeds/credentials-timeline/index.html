!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>这一年的坐标</title>
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: "Source Han Serif SC", "Noto Serif SC", "Songti SC", serif;
        background: #f4ead3;
        color: #2c2416;
      }
      main { padding: 1rem 1.1rem 1.15rem; }
      h1 {
        margin: 0 0 .85rem;
        font-size: 1.02rem;
        font-weight: 600;
        letter-spacing: .04em;
      }
      ol {
        list-style: none;
        margin: 0;
        padding: 0;
        border-left: 2px solid #cbb892;
      }
      li {
        position: relative;
        padding: .12rem 0 .9rem 1.15rem;
      }
      li:last-child { padding-bottom: .15rem; }
      li::before {
        content: "";
        position: absolute;
        left: -.42rem;
        top: .48rem;
        width: .65rem;
        height: .65rem;
        border-radius: 50%;
        background: #0e6f6e;
        box-shadow: 0 0 0 3px #dcebe9;
      }
      strong {
        display: block;
        font-size: .95rem;
        color: #7a4a28;
      }
      p {
        margin: .22rem 0 0;
        font-size: .82rem;
        line-height: 1.6;
        color: #4a3f2e;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>说这些话之前，先交代坐标</h1>
      <ol>
        <li>
          <strong>投入强度</strong>
          <p>AI 编程方向大约一年；最近半年，每天与 AI 协同编程常在 20 小时以上，基本没有中断。</p>
        </li>
        <li>
          <strong>企业合作</strong>
          <p>与两家企业保持深度合作，交付过多个 AI 智能体方向的项目。</p>
        </li>
        <li>
          <strong>赛事成绩</strong>
          <p>国内大型黑客松极限赛道三等奖；全国大学生计算机应用能力大赛 AIGC 创新赛省级二等奖；华中科技大学校级智能体大赛，作为基础医学非科班学生带队获决赛三等奖——同组获奖者几乎都来自计算机、网安等对口专业。</p>
        </li>
      </ol>
    </main>
    <script>
      (() => {
        const nonce = new URLSearchParams(location.hash.slice(1)).get('nonce')
        if (nonce) parent.postMessage({ nonce, message: { type: 'ready' } }, '*')
        const reportHeight = () => {
          parent.postMessage(
            { type: 'resize', height: document.documentElement.scrollHeight },
            '*',
          )
        }
        requestAnimationFrame(reportHeight)
        new ResizeObserver(reportHeight).observe(document.documentElement)
      })()
    </script>
  </body>
</html>
