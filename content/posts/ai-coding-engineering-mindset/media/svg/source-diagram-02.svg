  <text x="75" y="176" font-family="Noto Sans CJK SC" font-size="11" text-anchor="middle" fill="#0a4f4f">形态</text>

  <!-- right wide box with sub nodes -->
  <rect x="180" y="40" width="430" height="190" rx="6" fill="#fff" stroke="#c97a24" stroke-width="1.6" stroke-dasharray="4 3"/>
  <text x="395" y="30" font-family="Noto Serif CJK SC" font-weight="700" font-size="14" text-anchor="middle" fill="#c97a24">计算机 / 软件工程 —— 一个极大的学科集群</text>

  <g font-family="Noto Sans CJK SC" font-size="10.5" fill="#171a21">
    <rect x="196" y="58" width="88" height="34" rx="4" fill="#f4f3ee" stroke="#cfc9b8"/><text x="240" y="79" text-anchor="middle">网站前端</text>
    <rect x="292" y="58" width="88" height="34" rx="4" fill="#f4f3ee" stroke="#cfc9b8"/><text x="336" y="79" text-anchor="middle">后端 / API</text>
    <rect x="388" y="58" width="88" height="34" rx="4" fill="#f4f3ee" stroke="#cfc9b8"/><text x="432" y="79" text-anchor="middle">移动端 APP</text>
    <rect x="484" y="58" width="106" height="34" rx="4" fill="#f4f3ee" stroke="#cfc9b8"/><text x="537" y="79" text-anchor="middle">云 / SaaS 平台</text>

    <rect x="196" y="102" width="88" height="34" rx="4" fill="#f4f3ee" stroke="#cfc9b8"/><text x="240" y="123" text-anchor="middle">网络安全</text>
    <rect x="292" y="102" width="88" height="34" rx="4" fill="#f4f3ee" stroke="#cfc9b8"/><text x="336" y="123" text-anchor="middle">硬件 / 物联网</text>
    <rect x="388" y="102" width="88" height="34" rx="4" fill="#f4f3ee" stroke="#cfc9b8"/><text x="432" y="123" text-anchor="middle">大模型训练</text>
    <rect x="484" y="102" width="106" height="34" rx="4" fill="#f4f3ee" stroke="#cfc9b8"/><text x="537" y="123" text-anchor="middle">智能体 / Agent</text>

    <rect x="196" y="146" width="88" height="34" rx="4" fill="#f4f3ee" stroke="#cfc9b8"/><text x="240" y="167" text-anchor="middle">部署 / 运维</text>
    <rect x="292" y="146" width="88" height="34" rx="4" fill="#f4f3ee" stroke="#cfc9b8"/><text x="336" y="167" text-anchor="middle">数据库</text>
    <rect x="388" y="146" width="88" height="34" rx="4" fill="#f4f3ee" stroke="#cfc9b8"/><text x="432" y="167" text-anchor="middle">桌面端软件</text>
    <rect x="484" y="146" width="106" height="34" rx="4" fill="#f4f3ee" stroke="#cfc9b8"/><text x="537" y="167" text-anchor="middle">浏览器 / IDE 插件</text>
  </g>
  <text x="395" y="212" font-family="Noto Sans CJK SC" font-size="10" text-anchor="middle" fill="#3a4048">↑ 每一个格子背后，都是一整条可以独立深挖的技术线</text>
</svg>
