<svg width="640" height="260" viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg">
<rect id="original-paper-backplate" x="0" y="0" width="640" height="260" fill="#ffffff"/>
  <rect x="0" y="0" width="640" height="260" fill="none"/>
  <!-- left narrow column -->
  <rect x="30" y="60" width="90" height="150" rx="4" fill="#dcebe9" stroke="#0e6f6e" stroke-width="1.4"/>
  <text x="75" y="45" font-family="Noto Sans CJK SC" font-size="12" text-anchor="middle" fill="#171a21">生图 / 生视频 / 文案</text>
  <text x="75" y="140" font-family="Noto Sans CJK SC" font-size="11" text-anchor="middle" fill="#0a4f4f">聚焦</text>
