<svg width="640" height="180" viewBox="0 0 640 180" xmlns="http://www.w3.org/2000/svg">
<rect id="original-paper-backplate" x="0" y="0" width="640" height="180" fill="#ffffff"/>
  <g font-family="Noto Sans CJK SC" font-size="10.5">
    <text x="150" y="20" text-anchor="middle" fill="#3a4048">强模型 + 定位模糊</text>
    <rect x="60" y="30" width="180" height="34" fill="#f7e6de" stroke="#a83c1f" stroke-width="1.2"/>
    <text x="150" y="52" text-anchor="middle" fill="#a83c1f">高消耗</text>
    <rect x="60" y="72" width="70" height="30" fill="#f7e6de" stroke="#a83c1f" stroke-width="1.2"/>
    <text x="95" y="92" text-anchor="middle" fill="#a83c1f">产出一般</text>

    <text x="470" y="20" text-anchor="middle" fill="#3a4048">经验清晰 + 精准指挥（便宜模型）</text>
    <rect x="350" y="30" width="70" height="34" fill="#dcebe9" stroke="#0e6f6e" stroke-width="1.2"/>
    <text x="385" y="52" text-anchor="middle" fill="#0a4f4f">低消耗</text>
    <rect x="350" y="72" width="180" height="30" fill="#dcebe9" stroke="#0e6f6e" stroke-width="1.2"/>
    <text x="440" y="92" text-anchor="middle" fill="#0a4f4f">同等甚至更好的产出</text>

    <text x="320" y="140" text-anchor="middle" font-size="11" fill="#171a21" font-weight="700">差距来自"经验"而非"预算"</text>
  </g>
</svg>
