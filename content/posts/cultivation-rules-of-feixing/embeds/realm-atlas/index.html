<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>沿着境界，向上看</title><style>
:root{--paper:#f6f1e7;--ink:#302c26;--muted:#70665a;--line:#d8cebd;--accent:#9a6034;--wash:#ebe0cd;--ease-damp:cubic-bezier(.22,.82,.28,1);color-scheme:light dark}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.8 "Noto Serif CJK","Source Han Serif SC","Songti SC",SimSun,serif}main{padding:clamp(20px,5vw,42px);max-width:1080px;margin:auto}h1,h2,p{margin:0}h1{font-weight:500;font-size:clamp(24px,5vw,40px);line-height:1.35;letter-spacing:.04em;margin:8px 0 14px}h2{font-weight:500;font-size:22px}.eyebrow{font:11px/1.5 Consolas,monospace;letter-spacing:.18em;text-transform:uppercase;color:var(--accent)}.intro,.caption{color:var(--muted);font-size:13px}.caption{margin-top:18px;border-top:1px solid var(--line);padding-top:12px}button,input,select{font:inherit}button{cursor:pointer;border:1px solid var(--line);background:transparent;color:var(--ink);padding:9px 16px;min-height:44px;transition:background .3s,color .3s}button:hover,button[aria-pressed=true]{background:var(--ink);color:var(--paper)}button:disabled{opacity:.45;cursor:default}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:4px}input[type=range]{width:100%;accent-color:var(--accent)}.controls{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}.readout{border-left:2px solid var(--accent);padding:8px 0 8px 20px;margin-top:20px;min-height:80px}.readout p{white-space:pre-wrap}.readout small{color:var(--muted)}svg,canvas{max-width:100%;display:block}blockquote{margin:0;white-space:pre-wrap}details{margin-top:18px}summary{cursor:pointer;color:var(--accent);min-height:44px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:13px/1.8 Consolas,monospace}.theme{float:right;font-size:12px;padding:3px 10px;min-height:34px}
:root[data-theme=night]{--paper:#171b1c;--ink:#e9e4d8;--muted:#b6b1a6;--line:#444846;--accent:#deb47d;--wash:#293333;color-scheme:dark}
@media(prefers-color-scheme:dark){:root:not([data-theme=paper]){--paper:#171b1c;--ink:#e9e4d8;--muted:#b6b1a6;--line:#444846;--accent:#deb47d;--wash:#293333}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

.atlas{display:grid;grid-template-columns:minmax(150px,1fr) minmax(0,1.4fr);gap:32px;margin-top:28px}.steps{display:flex;flex-direction:column-reverse;gap:6px;border-left:1px solid var(--line);padding-left:12px}.steps button{text-align:left;width:calc(100% - var(--offset));margin-left:var(--offset);border-width:0 0 1px 0}.folio{background:var(--wash);padding:24px;align-self:center}.seal{font-size:72px;color:var(--accent);line-height:1.2;margin-bottom:16px}.folio blockquote{font-size:16px}.note{font-size:12px;color:var(--muted);margin-top:16px}@media(max-width:540px){.atlas{grid-template-columns:1fr;gap:14px}.steps{display:grid;grid-template-columns:repeat(2,1fr);border:0;padding:0}.steps button{margin:0;width:100%}.seal{font-size:44px}}</style></head>
<body><main><button class="theme" data-theme-toggle aria-label="切换小页明暗主题">明 / 暗</button><div class="eyebrow">FICTION FIELDNOTES / 07.07</div><h1>沿着境界，向上看</h1><p class="intro">点选境界，查看设定草稿对应的原文。图形高度只表示阅读顺序，不表示数值强弱。</p>
<div class="atlas"><nav class="steps" aria-label="境界选择"><button data-level="0" style="--offset:0%" aria-pressed="true">1.练气</button><button data-level="1" style="--offset:5%" aria-pressed="false">2.筑基</button><button data-level="2" style="--offset:10%" aria-pressed="false">3.金丹</button><button data-level="3" style="--offset:15%" aria-pressed="false">4.元婴</button><button data-level="4" style="--offset:20%" aria-pressed="false">5.天元</button><button data-level="5" style="--offset:25%" aria-pressed="false">6.化真</button><button data-level="6" style="--offset:30%" aria-pressed="false">7.问仙</button></nav><section class="folio" aria-live="polite"><div class="seal" id="realm-number">01</div><blockquote id="realm-text">1.练气：开始吸收天地元气，提升自己修为，具有一定的法术。可以开辟丹田，具有灵气。但修到极致也没有登堂入室，难以真正突破凡人之躯，故而血量难以提升。
      面气分为面气初期练气，中期练气，后期练气巅峰，练气圆满，每一个跨度都是极大的提升。
巅峰和圆满的差距就在于是否可以渡劫成就下一境界。</blockquote><p class="note">原稿写“共分6层”，并列有第7项“问仙”。此处照录，不替作者消除设定差异。</p></section></div>
<p class="caption">阅读辅助 · 原文摘录；没有新增修炼规则、伤害倍率或数值。</p></main>

<script>
(() => {
  const nonce = new URLSearchParams(location.hash.slice(1)).get('nonce')
  if (!nonce || window.parent === window) return
  window.parent.postMessage({ nonce, message: { type: 'ready' } }, '*')
  const reportHeight = () => window.parent.postMessage({ type: 'resize', height: document.documentElement.scrollHeight }, '*')
  requestAnimationFrame(reportHeight)
  new ResizeObserver(reportHeight).observe(document.documentElement)
})()
</script><script>
document.querySelector('[data-theme-toggle]').addEventListener('click',()=>{const dark=getComputedStyle(document.documentElement).getPropertyValue('--paper').trim()==='#171b1c';document.documentElement.dataset.theme=dark?'paper':'night';window.dispatchEvent(new Event('themechange'))})

const levels=[{"title": "1.练气", "text": "1.练气：开始吸收天地元气，提升自己修为，具有一定的法术。可以开辟丹田，具有灵气。但修到极致也没有登堂入室，难以真正突破凡人之躯，故而血量难以提升。\n      面气分为面气初期练气，中期练气，后期练气巅峰，练气圆满，每一个跨度都是极大的提升。\n巅峰和圆满的差距就在于是否可以渡劫成就下一境界。"}, {"title": "2.筑基", "text": "2.筑基：真正铸就修炼基础，可以提升一定血量，但最终仍旧在凡人领域。真元（灵气）大幅度增加"}, {"title": "3.金丹", "text": "3.金丹：真正步入修真行列，血量可以大幅度提升，抗性也大幅度提升，身体内的真元成指数倍增加，可以掌握法宝，但晋级金丹需要度过雷劫"}, {"title": "4.元婴", "text": "4.元婴：即使虚拟血量为0后也不会立即死亡，元婴可以溢出，且元婴的抗性极强，可以在敌人手中逃得一命"}, {"title": "5.天元", "text": "5.天元：可以调动周围的天地元气，真源回复速度爆炸式增加，伤害爆炸式增加"}, {"title": "6.化真", "text": "6.化真：可以修炼出域，能禁锢住他人，是巅峰存在"}, {"title": "7.问仙", "text": "7.问仙：追寻仙道，从此境界开始，修炼不在凭借普通修为，而是凭借顿悟"}];document.querySelectorAll("[data-level]").forEach(b=>b.addEventListener("click",()=>{const i=Number(b.dataset.level);document.querySelectorAll("[data-level]").forEach(x=>x.setAttribute("aria-pressed",String(x===b)));document.querySelector("#realm-number").textContent=String(i+1).padStart(2,"0");document.querySelector("#realm-text").textContent=levels[i].text}))</script></body></html>
