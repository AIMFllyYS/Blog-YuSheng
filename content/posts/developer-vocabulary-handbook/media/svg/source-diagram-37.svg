<svg viewBox="0 0 480 250" xmlns="http://www.w3.org/2000/svg">
<rect id="original-paper-backplate" x="0" y="0" width="480" height="250" fill="#ffffff"/><polygon points="177.6,0.0 302.4,0.0 343.2,55.0 136.8,55.0" fill="#A1483C" fill-opacity="0.10" stroke="#A1483C" stroke-width="1.1"/><text x="240.0" y="24.5" text-anchor="middle" font-family="'Noto Sans SC'" font-size="11.5" font-weight="700" fill="#A1483C">冒烟测试</text><text x="240.0" y="39.5" text-anchor="middle" font-family="'Noto Sans SC'" font-size="7.8" font-weight="500" fill="#6b6f76">最快最粗，能不能打开</text><polygon points="136.8,55.0 343.2,55.0 384.0,110.0 96.0,110.0" fill="#A1483C" fill-opacity="0.13" stroke="#A1483C" stroke-width="1.1"/><text x="240.0" y="79.5" text-anchor="middle" font-family="'Noto Sans SC'" font-size="11.5" font-weight="700" fill="#A1483C">端到端测试</text><text x="240.0" y="94.5" text-anchor="middle" font-family="'Noto Sans SC'" font-size="7.8" font-weight="500" fill="#6b6f76">模拟真实用户走一遍</text><polygon points="96.0,110.0 384.0,110.0 424.8,165.0 55.2,165.0" fill="#A1483C" fill-opacity="0.17" stroke="#A1483C" stroke-width="1.1"/><text x="240.0" y="134.5" text-anchor="middle" font-family="'Noto Sans SC'" font-size="11.5" font-weight="700" fill="#A1483C">集成测试</text><text x="240.0" y="149.5" text-anchor="middle" font-family="'Noto Sans SC'" font-size="7.8" font-weight="500" fill="#6b6f76">几个模块凑在一起</text><polygon points="55.2,165.0 424.8,165.0 465.6,220.0 14.4,220.0" fill="#A1483C" fill-opacity="0.20" stroke="#A1483C" stroke-width="1.1"/><text x="240.0" y="189.5" text-anchor="middle" font-family="'Noto Sans SC'" font-size="11.5" font-weight="700" fill="#A1483C">单元测试</text><text x="240.0" y="204.5" text-anchor="middle" font-family="'Noto Sans SC'" font-size="7.8" font-weight="500" fill="#6b6f76">单独测一个函数/零件</text><text x="240.0" y="240.0" text-anchor="middle" font-family="'Noto Sans SC'" font-size="8.2" font-weight="500" fill="#8B8F97">回归测试：每次改动后，把以上检查重新跑一遍</text></svg>
