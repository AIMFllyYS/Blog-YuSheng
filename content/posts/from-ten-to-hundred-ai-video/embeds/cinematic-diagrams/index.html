<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>三张母图：布光、景别、轴线</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: "Source Han Serif SC", "Noto Serif SC", "Songti SC", serif;
        background: #f4ead3;
        color: #2c2416;
      }
      main { padding: .8rem .85rem 1rem; display: grid; gap: .75rem; }
      p.kicker {
        margin: 0;
        font-size: .66rem;
        letter-spacing: .16em;
        color: #7a6a4e;
      }
      h1 {
        margin: .15rem 0 .15rem;
        font-size: 1.02rem;
        font-weight: 600;
      }
      figure {
        margin: 0;
        background: #fbf6ea;
        border: 1px solid #d8c9a4;
        padding: .45rem .5rem .55rem;
      }
      svg { display: block; width: 100%; height: auto; }
      figcaption {
        margin: .35rem .15rem 0;
        font-size: .7rem;
        color: #7a6a4e;
      }
      text { font-family: "Source Han Serif SC", "Noto Serif SC", "Songti SC", serif; }
    </style>
  </head>
  <body>
    <main>
      <header>
        <p class="kicker">THREE MOTHER DIAGRAMS</p>
        <h1>后文会反复用到的三张母图</h1>
      </header>

      <figure>
        <svg viewBox="0 0 520 250" role="img" aria-label="三点布光俯视图">
          <text x="14" y="22" font-size="13" font-weight="700" fill="#2c2416">三点布光 · 俯视图</text>
          <text x="14" y="38" font-size="9" fill="#7a6a4e">THREE-POINT LIGHTING</text>
          <circle cx="260" cy="148" r="18" fill="#2c2416" />
          <text x="260" y="153" font-size="10" fill="#f4ead3" text-anchor="middle">人物</text>
          <rect x="247" y="208" width="26" height="14" fill="none" stroke="#2c2416" stroke-width="1.4" />
          <path d="M260 208 L253 200 L267 200 Z" fill="#2c2416" />
          <text x="260" y="238" font-size="10" text-anchor="middle" fill="#2c2416">摄影机</text>
          <circle cx="118" cy="78" r="16" fill="#7a4a28" />
          <text x="118" y="83" font-size="10" fill="#f4ead3" text-anchor="middle">主</text>
          <path d="M132 90 L242 138" stroke="#7a4a28" stroke-width="1.6" stroke-dasharray="4 3" fill="none" />
          <text x="48" y="62" font-size="11" font-weight="700" fill="#2c2416">主光 KEY</text>
          <text x="48" y="76" font-size="9" fill="#7a6a4e">最亮 · 定方向定性格</text>
          <circle cx="402" cy="96" r="14" fill="#f4ead3" stroke="#7a4a28" stroke-width="1.5" />
          <text x="402" y="100" font-size="10" text-anchor="middle" fill="#2c2416">辅</text>
          <path d="M390 108 L278 142" stroke="#a8790a" stroke-width="1.2" stroke-dasharray="2 3" fill="none" />
          <text x="368" y="62" font-size="11" font-weight="700" fill="#2c2416">辅光 FILL</text>
          <text x="352" y="76" font-size="9" fill="#7a6a4e">填暗部 · 控制反差比例</text>
          <circle cx="260" cy="58" r="14" fill="#7a6a4e" />
          <text x="260" y="62" font-size="10" fill="#f4ead3" text-anchor="middle">轮</text>
          <path d="M260 72 L260 128" stroke="#7a6a4e" stroke-width="1.2" stroke-dasharray="2 3" fill="none" />
          <text x="286" y="48" font-size="11" font-weight="700" fill="#2c2416">轮廓光 RIM</text>
          <text x="286" y="62" font-size="9" fill="#7a6a4e">从背后勾边 · 人景分离</text>
        </svg>
        <figcaption>图 2-1 · 记住三个角色，而不是三个位置。</figcaption>
      </figure>

      <figure>
        <svg viewBox="0 0 720 200" role="img" aria-label="五级景别滑杆">
          <text x="14" y="20" font-size="13" font-weight="700" fill="#2c2416">五级景别 · 信息 → 情绪的滑杆</text>
          <g stroke="#2c2416" fill="none" stroke-width="1.4">
            <g transform="translate(18,32)">
              <rect width="128" height="108" fill="#fbf6ea" stroke="#d8c9a4" />
              <path d="M10 90 L42 58 L64 74 L92 40 L118 68" stroke="#7a6a4e" stroke-width="1" />
              <g transform="translate(64,70) scale(.32)"><circle cx="0" cy="-28" r="8"/><line x1="0" y1="-20" x2="0" y2="8"/><line x1="0" y1="-12" x2="-12" y2="2"/><line x1="0" y1="-12" x2="12" y2="2"/><line x1="0" y1="8" x2="-9" y2="30"/><line x1="0" y1="8" x2="9" y2="30"/></g>
              <text x="8" y="126" font-size="12" font-weight="700" stroke="none" fill="#2c2416">远景</text>
              <text x="8" y="140" font-size="9" stroke="none" fill="#7a6a4e">定场 · 人在环境里</text>
            </g>
            <g transform="translate(158,32)">
              <rect width="128" height="108" fill="#f7f0dc" stroke="#d8c9a4" />
              <g transform="translate(64,58) scale(.72)"><circle cx="0" cy="-28" r="8"/><line x1="0" y1="-20" x2="0" y2="8"/><line x1="0" y1="-12" x2="-12" y2="2"/><line x1="0" y1="-12" x2="12" y2="2"/><line x1="0" y1="8" x2="-9" y2="30"/><line x1="0" y1="8" x2="9" y2="30"/></g>
              <text x="8" y="126" font-size="12" font-weight="700" stroke="none" fill="#2c2416">全景</text>
              <text x="8" y="140" font-size="9" stroke="none" fill="#7a6a4e">姿态可见 · 表演=肢体</text>
            </g>
            <g transform="translate(298,32)">
              <rect width="128" height="108" fill="#f3e8d0" stroke="#d8c9a4" />
              <g transform="translate(64,78) scale(1.2)"><circle cx="0" cy="-28" r="8"/><line x1="0" y1="-20" x2="0" y2="8"/><line x1="0" y1="-12" x2="-12" y2="2"/><line x1="0" y1="-12" x2="12" y2="2"/></g>
              <text x="8" y="126" font-size="12" font-weight="700" stroke="none" fill="#2c2416">中景</text>
              <text x="8" y="140" font-size="9" stroke="none" fill="#7a6a4e">对话主力 · 关系手势</text>
            </g>
            <g transform="translate(438,32)">
              <rect width="128" height="108" fill="#efe0c4" stroke="#d8c9a4" />
              <g transform="translate(64,92) scale(1.7)"><circle cx="0" cy="-28" r="8"/><line x1="0" y1="-20" x2="0" y2="4"/><line x1="0" y1="-12" x2="-10" y2="-2"/><line x1="0" y1="-12" x2="10" y2="-2"/></g>
              <text x="8" y="126" font-size="12" font-weight="700" stroke="none" fill="#2c2416">近景</text>
              <text x="8" y="140" font-size="9" stroke="none" fill="#7a6a4e">表情主导 · 亲近感</text>
            </g>
            <g transform="translate(578,32)">
              <rect width="128" height="108" fill="#ead6b4" stroke="#7a4a28" />
              <g transform="translate(64,118) scale(2.5)"><circle cx="0" cy="-28" r="8"/></g>
              <text x="8" y="126" font-size="12" font-weight="700" stroke="none" fill="#2c2416">特写</text>
              <text x="8" y="140" font-size="9" stroke="none" fill="#7a6a4e">纯情绪 · 省着用</text>
            </g>
          </g>
        </svg>
        <figcaption>图 4-1 · 远景定场 → 中景入戏 → 特写点题。两极组接是最低成本的重音。</figcaption>
      </figure>

      <figure>
        <svg viewBox="0 0 520 250" role="img" aria-label="一百八十度轴线俯视图">
          <text x="14" y="22" font-size="13" font-weight="700" fill="#2c2416">180° 轴线 · 俯视图</text>
          <line x1="50" y1="108" x2="470" y2="108" stroke="#7a4a28" stroke-width="1.6" stroke-dasharray="6 4" />
          <text x="476" y="112" font-size="10" fill="#7a4a28">轴线</text>
          <circle cx="170" cy="108" r="16" fill="#5a4a28" />
          <text x="170" y="113" font-size="12" fill="#f4ead3" text-anchor="middle">A</text>
          <circle cx="350" cy="108" r="16" fill="#2c2416" />
          <text x="350" y="113" font-size="12" fill="#f4ead3" text-anchor="middle">B</text>
          <g transform="translate(150,176)">
            <rect x="-12" y="0" width="24" height="14" fill="none" stroke="#4a5a38" stroke-width="1.4" />
            <path d="M0 0 L-6 -7 L6 -7 Z" fill="#4a5a38" />
            <text x="0" y="28" font-size="9" text-anchor="middle" fill="#4a5a38">机位 1 · 拍 B（越 A 肩）</text>
          </g>
          <g transform="translate(370,176)">
            <rect x="-12" y="0" width="24" height="14" fill="none" stroke="#4a5a38" stroke-width="1.4" />
            <path d="M0 0 L-6 -7 L6 -7 Z" fill="#4a5a38" />
            <text x="0" y="28" font-size="9" text-anchor="middle" fill="#4a5a38">机位 2 · 拍 A（越 B 肩）</text>
          </g>
          <path d="M158 174 L332 126" stroke="#4a5a38" stroke-width=".9" stroke-dasharray="2 2" fill="none" />
          <path d="M362 174 L188 126" stroke="#4a5a38" stroke-width=".9" stroke-dasharray="2 2" fill="none" />
          <g transform="translate(260,40)">
            <rect x="-12" y="0" width="24" height="14" fill="none" stroke="#7a4a28" stroke-width="1.4" />
            <path d="M0 14 L-6 21 L6 21 Z" fill="#7a4a28" />
            <line x1="-16" y1="-3" x2="16" y2="18" stroke="#7a4a28" stroke-width="1.5" />
            <text x="0" y="-8" font-size="10" text-anchor="middle" fill="#7a4a28">越轴 = 方位跳变，观众迷失</text>
          </g>
          <text x="50" y="238" font-size="10" fill="#7a6a4e">同侧机位内：A 永远看向右，B 永远看向左 —— 空间关系稳定。</text>
        </svg>
        <figcaption>图 4-2 · 对话戏的空间铁律：所有机位待在轴线同一侧。</figcaption>
      </figure>
    </main>
    <script>
      (() => {
        const nonce = new URLSearchParams(location.hash.slice(1)).get('nonce')
        if (nonce) parent.postMessage({ nonce, message: { type: 'ready' } }, '*')
        const reportHeight = () => {
          parent.postMessage(
            { type: 'resize', height: document.documentElement.scrollHeight },
            '*',
          )
        }
        requestAnimationFrame(reportHeight)
        new ResizeObserver(reportHeight).observe(document.documentElement)
      })()
    </script>
  </body>
</html>
