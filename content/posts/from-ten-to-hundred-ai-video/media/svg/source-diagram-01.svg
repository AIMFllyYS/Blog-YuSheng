<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 250" style="width:100%; border:.35mm solid var(--ink); background:#fff;">
<rect id="original-paper-backplate" x="0" y="0" width="340" height="250" fill="#ffffff"/>
        <text x="14" y="24" font-size="10" font-weight="700" letter-spacing="2">三段完全不同的路</text>
        <text x="14" y="37" font-size="6.5" fill="#8A8D94" letter-spacing="1">THREE STAGES, THREE SKILLS</text>
        <!-- stage 1 -->
        <rect x="14" y="185" width="96" height="40" fill="#F1F1EB" stroke="#1B1D22" stroke-width="1"/>
        <text x="22" y="201" font-size="9" font-weight="700">0 → 1</text>
        <text x="22" y="214" font-size="7" fill="#50535B">会用工具:能生成画面</text>
        <text x="22" y="240" font-size="6.5" fill="#8A8D94">靠 教程 · 模仿</text>
        <!-- stage 2 -->
        <rect x="122" y="140" width="96" height="85" fill="#F1F1EB" stroke="#1B1D22" stroke-width="1"/>
        <text x="130" y="156" font-size="9" font-weight="700">1 → 10</text>
        <text x="130" y="169" font-size="7" fill="#50535B">打通工作流:能出完整片</text>
        <text x="130" y="181" font-size="7" fill="#50535B">脚本-生成-配音-字幕</text>
        <text x="130" y="240" font-size="6.5" fill="#8A8D94">靠 工具 · 流程</text>
        <text x="130" y="205" font-size="7.5" font-weight="700" fill="#BE3A2B">← 大多数人停在这里</text>
        <!-- stage 3 -->
        <rect x="230" y="58" width="96" height="167" fill="#1B1D22"/>
        <text x="238" y="76" font-size="9" font-weight="700" fill="#FBFBF8">10 → 100</text>
        <text x="238" y="90" font-size="7" fill="#DDDDD6">注入影视语言</text>
        <text x="238" y="106" font-size="7" fill="#DDDDD6">表演 · 美术 · 色彩</text>
        <text x="238" y="117" font-size="7" fill="#DDDDD6">镜头 · 剪辑 · 声音</text>
        <text x="238" y="240" font-size="6.5" fill="#8A8D94">靠 专业知识 · 打穿</text>
        <!-- 彩条 in stage3 -->
        <rect x="238" y="126" width="13" height="4" fill="#BE3A2B"/><rect x="251" y="126" width="13" height="4" fill="#A8790A"/><rect x="264" y="126" width="13" height="4" fill="#A93A8C"/><rect x="277" y="126" width="13" height="4" fill="#2E5FA3"/><rect x="290" y="126" width="13" height="4" fill="#17858A"/><rect x="303" y="126" width="13" height="4" fill="#4C8440"/>
        <!-- arrows -->
        <path d="M 110 195 L 120 175" stroke="#8A8D94" stroke-width="1" fill="none" marker-end="url(#ar)"/>
        <path d="M 218 155 L 228 130" stroke="#8A8D94" stroke-width="1" fill="none" marker-end="url(#ar)"/>
        <defs><marker id="ar" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#8A8D94"/></marker></defs>
      </svg>
