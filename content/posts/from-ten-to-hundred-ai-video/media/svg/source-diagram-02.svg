<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" style="width:100%; border:.35mm solid var(--ink); background:#fff;">
<rect id="original-paper-backplate" x="0" y="0" width="720" height="400" fill="#ffffff"/>
    <!-- 导演中心 -->
    <circle cx="360" cy="196" r="52" fill="#1B1D22"/>
    <text x="360" y="190" font-size="15" font-weight="900" fill="#FBFBF8" text-anchor="middle">导演</text>
    <text x="360" y="207" font-size="7.5" fill="#DDDDD6" text-anchor="middle">= 你 + AI</text>
    <text x="360" y="219" font-size="6.5" fill="#8A8D94" text-anchor="middle">统筹六个维度</text>
    <!-- 六工位 -->
    <g><!-- 表演 -->
      <line x1="318" y1="164" x2="163" y2="86" stroke="#BE3A2B" stroke-width="1.4"/>
      <rect x="42" y="42" width="150" height="76" fill="#F7E8E5" stroke="#BE3A2B" stroke-width="1.4"/>
      <rect x="42" y="42" width="150" height="17" fill="#BE3A2B"/>
      <text x="50" y="54" font-size="9" font-weight="700" fill="#fff">表演指导 · CH 01</text>
      <text x="50" y="73" font-size="7.5" fill="#1B1D22">人物的动作、表情、视线、</text>
      <text x="50" y="84" font-size="7.5" fill="#1B1D22">语气是否在传递正确的信息</text>
      <text x="50" y="101" font-size="6.8" fill="#8A8D94">空缺症状:人物"演得假"</text>
    </g>
    <g><!-- 美术 -->
      <line x1="360" y1="144" x2="360" y2="104" stroke="#A8790A" stroke-width="1.4"/>
      <rect x="285" y="28" width="150" height="76" fill="#F6EFDC" stroke="#A8790A" stroke-width="1.4"/>
      <rect x="285" y="28" width="150" height="17" fill="#A8790A"/>
      <text x="293" y="40" font-size="9" font-weight="700" fill="#fff">美术指导 · CH 02</text>
      <text x="293" y="59" font-size="7.5" fill="#1B1D22">场景、光线、服化道</text>
      <text x="293" y="70" font-size="7.5" fill="#1B1D22">在生成前就设计好画面</text>
      <text x="293" y="87" font-size="6.8" fill="#8A8D94">空缺症状:画面平庸没氛围</text>
    </g>
    <g><!-- 色彩 -->
      <line x1="402" y1="164" x2="557" y2="86" stroke="#A93A8C" stroke-width="1.4"/>
      <rect x="528" y="42" width="150" height="76" fill="#F5E6F0" stroke="#A93A8C" stroke-width="1.4"/>
      <rect x="528" y="42" width="150" height="17" fill="#A93A8C"/>
      <text x="536" y="54" font-size="9" font-weight="700" fill="#fff">调色师 · CH 03</text>
      <text x="536" y="73" font-size="7.5" fill="#1B1D22">色彩基调、配色关系、</text>
      <text x="536" y="84" font-size="7.5" fill="#1B1D22">跨镜头色彩一致与后期调色</text>
      <text x="536" y="101" font-size="6.8" fill="#8A8D94">空缺症状:镜头之间"不像一部片"</text>
    </g>
    <g><!-- 镜头 -->
      <line x1="318" y1="228" x2="163" y2="306" stroke="#2E5FA3" stroke-width="1.4"/>
      <rect x="42" y="274" width="150" height="76" fill="#E5EBF5" stroke="#2E5FA3" stroke-width="1.4"/>
      <rect x="42" y="274" width="150" height="17" fill="#2E5FA3"/>
      <text x="50" y="286" font-size="9" font-weight="700" fill="#fff">摄影指导 · CH 04</text>
      <text x="50" y="305" font-size="7.5" fill="#1B1D22">景别、构图、运镜、轴线——</text>
      <text x="50" y="316" font-size="7.5" fill="#1B1D22">把"画面"升级为"镜头"</text>
      <text x="50" y="333" font-size="6.8" fill="#8A8D94">空缺症状:一镜到底、景别单一</text>
    </g>
    <g><!-- 剪辑 -->
      <line x1="360" y1="248" x2="360" y2="288" stroke="#17858A" stroke-width="1.4"/>
      <rect x="285" y="288" width="150" height="76" fill="#E0F0F0" stroke="#17858A" stroke-width="1.4"/>
      <rect x="285" y="288" width="150" height="17" fill="#17858A"/>
      <text x="293" y="300" font-size="9" font-weight="700" fill="#fff">剪辑师 · CH 05</text>
      <text x="293" y="319" font-size="7.5" fill="#1B1D22">镜头如何组接成叙事、</text>
      <text x="293" y="330" font-size="7.5" fill="#1B1D22">节奏与情绪如何被"剪"出来</text>
      <text x="293" y="347" font-size="6.8" fill="#8A8D94">空缺症状:素材硬拼、没有节奏</text>
    </g>
    <g><!-- 声音 -->
      <line x1="402" y1="228" x2="557" y2="306" stroke="#4C8440" stroke-width="1.4"/>
      <rect x="528" y="274" width="150" height="76" fill="#E7F0E4" stroke="#4C8440" stroke-width="1.4"/>
      <rect x="528" y="274" width="150" height="17" fill="#4C8440"/>
      <text x="536" y="286" font-size="9" font-weight="700" fill="#fff">声音设计师 · CH 06</text>
      <text x="536" y="305" font-size="7.5" fill="#1B1D22">BGM、音效、人声、静默——</text>
      <text x="536" y="316" font-size="7.5" fill="#1B1D22">用耳朵完成另一半真实感</text>
      <text x="536" y="333" font-size="6.8" fill="#8A8D94">空缺症状:全片一首 BGM 铺到底</text>
    </g>
  </svg>
