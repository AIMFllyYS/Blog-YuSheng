<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 168" style="width:100%; border:.35mm solid var(--ink); background:#fff;">
<rect id="original-paper-backplate" x="0" y="0" width="720" height="168" fill="#ffffff"/>
    <text x="14" y="20" font-size="9" font-weight="700" letter-spacing="2">六种基本情绪的面部编码方向(示意)</text>
    <!-- 六张脸 -->
    <g transform="translate(30,38)"><!-- 愤怒 -->
      <circle cx="40" cy="40" r="30" fill="#F7E8E5" stroke="#1B1D22" stroke-width="1.2"/>
      <path d="M 26 30 L 38 35 M 54 35 L 66 30" stroke="#1B1D22" stroke-width="2"/>
      <circle cx="32" cy="41" r="2.4" fill="#1B1D22"/><circle cx="48" cy="41" r="2.4" fill="#1B1D22"/>
      <line x1="30" y1="56" x2="50" y2="56" stroke="#1B1D22" stroke-width="2"/>
      <text x="40" y="88" font-size="8.5" font-weight="700" text-anchor="middle">愤怒</text>
      <text x="40" y="100" font-size="6.2" fill="#50535B" text-anchor="middle">眉内压 · 瞪眼</text>
      <text x="40" y="110" font-size="6.2" fill="#50535B" text-anchor="middle">抿唇 · 下颌紧绷</text>
    </g>
    <g transform="translate(140,38)"><!-- 悲伤 -->
      <circle cx="40" cy="40" r="30" fill="#F7E8E5" stroke="#1B1D22" stroke-width="1.2"/>
      <path d="M 26 34 Q 33 29 39 33 M 41 33 Q 47 29 54 34" stroke="#1B1D22" stroke-width="1.8" fill="none"/>
      <circle cx="32" cy="42" r="2.2" fill="#1B1D22"/><circle cx="48" cy="42" r="2.2" fill="#1B1D22"/>
      <path d="M 31 58 Q 40 53 49 58" stroke="#1B1D22" stroke-width="2" fill="none"/>
      <text x="40" y="88" font-size="8.5" font-weight="700" text-anchor="middle">悲伤</text>
      <text x="40" y="100" font-size="6.2" fill="#50535B" text-anchor="middle">眉梢内上提</text>
      <text x="40" y="110" font-size="6.2" fill="#50535B" text-anchor="middle">嘴角下垂 · 目光低垂</text>
    </g>
    <g transform="translate(250,38)"><!-- 恐惧 -->
      <circle cx="40" cy="40" r="30" fill="#F7E8E5" stroke="#1B1D22" stroke-width="1.2"/>
      <path d="M 25 29 Q 32 25 39 28 M 41 28 Q 48 25 55 29" stroke="#1B1D22" stroke-width="1.8" fill="none"/>
      <circle cx="32" cy="40" r="3.2" fill="none" stroke="#1B1D22" stroke-width="1.6"/><circle cx="48" cy="40" r="3.2" fill="none" stroke="#1B1D22" stroke-width="1.6"/>
      <ellipse cx="40" cy="57" rx="5" ry="4" fill="none" stroke="#1B1D22" stroke-width="1.8"/>
      <text x="40" y="88" font-size="8.5" font-weight="700" text-anchor="middle">恐惧</text>
      <text x="40" y="100" font-size="6.2" fill="#50535B" text-anchor="middle">眉高抬并拢 · 睁大眼</text>
      <text x="40" y="110" font-size="6.2" fill="#50535B" text-anchor="middle">嘴微张后缩</text>
    </g>
    <g transform="translate(360,38)"><!-- 喜悦 -->
      <circle cx="40" cy="40" r="30" fill="#F7E8E5" stroke="#1B1D22" stroke-width="1.2"/>
      <path d="M 27 33 Q 33 30 39 33 M 41 33 Q 47 30 53 33" stroke="#1B1D22" stroke-width="1.6" fill="none"/>
      <path d="M 29 41 Q 32 38 35 41 M 45 41 Q 48 38 51 41" stroke="#1B1D22" stroke-width="1.8" fill="none"/>
      <path d="M 28 53 Q 40 63 52 53" stroke="#1B1D22" stroke-width="2" fill="none"/>
      <text x="40" y="88" font-size="8.5" font-weight="700" text-anchor="middle">喜悦</text>
      <text x="40" y="100" font-size="6.2" fill="#50535B" text-anchor="middle">真笑带眼:眼轮匝肌收缩</text>
      <text x="40" y="110" font-size="6.2" fill="#50535B" text-anchor="middle">"眼角起皱"是关键词</text>
    </g>
    <g transform="translate(470,38)"><!-- 惊讶 -->
      <circle cx="40" cy="40" r="30" fill="#F7E8E5" stroke="#1B1D22" stroke-width="1.2"/>
      <path d="M 26 28 Q 32 24 38 27 M 42 27 Q 48 24 54 28" stroke="#1B1D22" stroke-width="1.8" fill="none"/>
      <circle cx="32" cy="40" r="3" fill="none" stroke="#1B1D22" stroke-width="1.6"/><circle cx="48" cy="40" r="3" fill="none" stroke="#1B1D22" stroke-width="1.6"/>
      <ellipse cx="40" cy="57" rx="4.5" ry="5.5" fill="none" stroke="#1B1D22" stroke-width="1.8"/>
      <text x="40" y="88" font-size="8.5" font-weight="700" text-anchor="middle">惊讶</text>
      <text x="40" y="100" font-size="6.2" fill="#50535B" text-anchor="middle">眉弧形高抬 · 眼睁大</text>
      <text x="40" y="110" font-size="6.2" fill="#50535B" text-anchor="middle">嘴张成 O 形</text>
    </g>
    <g transform="translate(580,38)"><!-- 厌恶 -->
      <circle cx="40" cy="40" r="30" fill="#F7E8E5" stroke="#1B1D22" stroke-width="1.2"/>
      <path d="M 27 32 L 38 34 M 42 34 L 53 32" stroke="#1B1D22" stroke-width="1.8"/>
      <circle cx="32" cy="41" r="2" fill="#1B1D22"/><circle cx="48" cy="41" r="2" fill="#1B1D22"/>
      <path d="M 37 48 Q 40 46 43 48" stroke="#1B1D22" stroke-width="1.6" fill="none"/>
      <path d="M 30 57 Q 36 54 44 56 Q 48 57 50 59" stroke="#1B1D22" stroke-width="2" fill="none"/>
      <text x="40" y="88" font-size="8.5" font-weight="700" text-anchor="middle">厌恶</text>
      <text x="40" y="100" font-size="6.2" fill="#50535B" text-anchor="middle">皱鼻 · 上唇上提</text>
      <text x="40" y="110" font-size="6.2" fill="#50535B" text-anchor="middle">单侧嘴角撇起</text>
    </g>
  </svg>
