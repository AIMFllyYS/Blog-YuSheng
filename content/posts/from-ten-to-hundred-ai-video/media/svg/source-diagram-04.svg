<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 330 250" style="width:100%; border:.35mm solid var(--ink); background:#fff;">
<rect id="original-paper-backplate" x="0" y="0" width="330" height="250" fill="#ffffff"/>
        <text x="14" y="20" font-size="9" font-weight="700" letter-spacing="2">三点布光 · 俯视图</text>
        <text x="14" y="32" font-size="6.5" fill="#8A8D94" letter-spacing="1">THREE-POINT LIGHTING (TOP VIEW)</text>
        <!-- 人物 -->
        <circle cx="165" cy="150" r="14" fill="#1B1D22"/>
        <text x="165" y="154" font-size="7" fill="#fff" text-anchor="middle">人物</text>
        <!-- 相机 -->
        <rect x="152" y="212" width="26" height="16" fill="none" stroke="#1B1D22" stroke-width="1.4"/>
        <path d="M 165 212 L 158 204 L 172 204 Z" fill="#1B1D22"/>
        <text x="165" y="240" font-size="7" text-anchor="middle">摄影机</text>
        <!-- 主光 -->
        <circle cx="80" cy="80" r="13" fill="#A8790A"/>
        <text x="80" y="84" font-size="7" fill="#fff" text-anchor="middle">主</text>
        <path d="M 90 90 L 152 140" stroke="#A8790A" stroke-width="1.6" stroke-dasharray="4 3"/>
        <text x="52" y="62" font-size="7.5" font-weight="700">主光 KEY</text>
        <text x="52" y="72" font-size="6.2" fill="#50535B">最亮 · 定方向定性格</text>
        <!-- 辅光 -->
        <circle cx="255" cy="95" r="11" fill="#F6EFDC" stroke="#A8790A" stroke-width="1.4"/>
        <text x="255" y="99" font-size="7" text-anchor="middle">辅</text>
        <path d="M 246 103 L 180 143" stroke="#A8790A" stroke-width="1.2" stroke-dasharray="2 3" opacity=".55"/>
        <text x="238" y="76" font-size="7.5" font-weight="700">辅光 FILL</text>
        <text x="222" y="86" font-size="6.2" fill="#50535B">填暗部 · 控制反差比例</text>
        <!-- 轮廓光 -->
        <circle cx="165" cy="52" r="11" fill="#50535B"/>
        <text x="165" y="56" font-size="7" fill="#fff" text-anchor="middle">轮</text>
        <path d="M 165 64 L 165 134" stroke="#50535B" stroke-width="1.2" stroke-dasharray="2 3"/>
        <text x="188" y="48" font-size="7.5" font-weight="700">轮廓光 RIM</text>
        <text x="188" y="58" font-size="6.2" fill="#50535B">从背后勾边 · 人物与背景分离</text>
      </svg>
