<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 330 330" style="width:100%; border:.35mm solid var(--ink); background:#fff;">
<rect id="original-paper-backplate" x="0" y="0" width="330" height="330" fill="#ffffff"/>
        <text x="14" y="20" font-size="9" font-weight="700" letter-spacing="2">色环与五种配色骨架</text>
        <!-- 12色环 -->
        <g transform="translate(165,150)">
          <g id="wheel">
            <path d="M 0 -78 A 78 78 0 0 1 39 -67.5 L 26 -45 A 52 52 0 0 0 0 -52 Z" fill="#D93A2B"/>
            <path transform="rotate(30)" d="M 0 -78 A 78 78 0 0 1 39 -67.5 L 26 -45 A 52 52 0 0 0 0 -52 Z" fill="#E06A1F"/>
            <path transform="rotate(60)" d="M 0 -78 A 78 78 0 0 1 39 -67.5 L 26 -45 A 52 52 0 0 0 0 -52 Z" fill="#E5A31A"/>
            <path transform="rotate(90)" d="M 0 -78 A 78 78 0 0 1 39 -67.5 L 26 -45 A 52 52 0 0 0 0 -52 Z" fill="#D9C41E"/>
            <path transform="rotate(120)" d="M 0 -78 A 78 78 0 0 1 39 -67.5 L 26 -45 A 52 52 0 0 0 0 -52 Z" fill="#7BA829"/>
            <path transform="rotate(150)" d="M 0 -78 A 78 78 0 0 1 39 -67.5 L 26 -45 A 52 52 0 0 0 0 -52 Z" fill="#2F8F4E"/>
            <path transform="rotate(180)" d="M 0 -78 A 78 78 0 0 1 39 -67.5 L 26 -45 A 52 52 0 0 0 0 -52 Z" fill="#1F8A8C"/>
            <path transform="rotate(210)" d="M 0 -78 A 78 78 0 0 1 39 -67.5 L 26 -45 A 52 52 0 0 0 0 -52 Z" fill="#2A6FA8"/>
            <path transform="rotate(240)" d="M 0 -78 A 78 78 0 0 1 39 -67.5 L 26 -45 A 52 52 0 0 0 0 -52 Z" fill="#3D4DA0"/>
            <path transform="rotate(270)" d="M 0 -78 A 78 78 0 0 1 39 -67.5 L 26 -45 A 52 52 0 0 0 0 -52 Z" fill="#6E3D99"/>
            <path transform="rotate(300)" d="M 0 -78 A 78 78 0 0 1 39 -67.5 L 26 -45 A 52 52 0 0 0 0 -52 Z" fill="#A0378C"/>
            <path transform="rotate(330)" d="M 0 -78 A 78 78 0 0 1 39 -67.5 L 26 -45 A 52 52 0 0 0 0 -52 Z" fill="#C23364"/>
          </g>
          <!-- 互补连线 橙-蓝 -->
          <line x1="19" y1="-58" x2="-19" y2="58" stroke="#1B1D22" stroke-width="2"/>
          <circle cx="19" cy="-58" r="4" fill="#1B1D22"/><circle cx="-19" cy="58" r="4" fill="#1B1D22"/>
        </g>
        <text x="165" y="152" font-size="7" text-anchor="middle" font-weight="700">互补</text>
        <text x="165" y="162" font-size="6" text-anchor="middle" fill="#50535B">张力最大</text>
        <!-- 五种骨架小图例 -->
        <g transform="translate(16,250)" font-size="6.6">
          <g><circle cx="10" cy="8" r="7" fill="none" stroke="#8A8D94"/><circle cx="10" cy="1" r="2.2" fill="#1B1D22"/><circle cx="10" cy="15" r="2.2" fill="#1B1D22"/><text x="24" y="7" font-weight="700">互补</text><text x="24" y="16" fill="#50535B">对冲 · 张力</text></g>
          <g transform="translate(62,0)"><circle cx="10" cy="8" r="7" fill="none" stroke="#8A8D94"/><circle cx="10" cy="1" r="2.2" fill="#1B1D22"/><circle cx="16" cy="4" r="2.2" fill="#1B1D22"/><circle cx="4" cy="4" r="2.2" fill="#1B1D22"/><text x="24" y="7" font-weight="700">邻近</text><text x="24" y="16" fill="#50535B">和谐 · 统一</text></g>
          <g transform="translate(124,0)"><circle cx="10" cy="8" r="7" fill="none" stroke="#8A8D94"/><circle cx="10" cy="1" r="2.2" fill="#1B1D22"/><circle cx="4" cy="13" r="2.2" fill="#1B1D22"/><circle cx="16" cy="13" r="2.2" fill="#1B1D22"/><text x="24" y="7" font-weight="700">三角</text><text x="24" y="16" fill="#50535B">丰富 · 平衡</text></g>
          <g transform="translate(186,0)"><circle cx="10" cy="8" r="7" fill="none" stroke="#8A8D94"/><circle cx="10" cy="1" r="2.2" fill="#1B1D22"/><circle cx="5" cy="14" r="2.2" fill="#1B1D22"/><circle cx="15" cy="14" r="2.2" fill="#1B1D22"/><line x1="10" y1="1" x2="10" y2="8" stroke="#8A8D94" stroke-width=".6"/><text x="24" y="7" font-weight="700">分裂互补</text><text x="24" y="16" fill="#50535B">张力且不刺</text></g>
          <g transform="translate(258,0)"><circle cx="10" cy="8" r="7" fill="none" stroke="#8A8D94"/><circle cx="10" cy="1" r="2.2" fill="#1B1D22"/><circle cx="10" cy="1" r="4" fill="none" stroke="#1B1D22" stroke-width=".8"/><text x="24" y="7" font-weight="700">单色</text><text x="24" y="16" fill="#50535B">一色相变深浅</text></g>
        </g>
        <text x="16" y="300" font-size="6.4" fill="#8A8D94">经典的 Teal &amp; Orange 即"橙色肤色 × 青色环境"的互补方案工业化。</text>
      </svg>
