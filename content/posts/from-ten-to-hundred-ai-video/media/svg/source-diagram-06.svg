<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 330 190" style="width:100%; border:.35mm solid var(--ink); background:#fff;">
<rect id="original-paper-backplate" x="0" y="0" width="330" height="190" fill="#ffffff"/>
        <text x="14" y="20" font-size="9" font-weight="700" letter-spacing="2">色彩弧线:整部片子的颜色也有剧情</text>
        <!-- 渐变条 -->
        <defs>
          <linearGradient id="arc1" x1="0" x2="1">
            <stop offset="0" stop-color="#E5A31A"/><stop offset="0.45" stop-color="#B9975C"/>
            <stop offset="0.75" stop-color="#5E7288"/><stop offset="1" stop-color="#2A3B4E"/>
          </linearGradient>
        </defs>
        <rect x="20" y="46" width="290" height="26" fill="url(#arc1)"/>
        <text x="20" y="86" font-size="6.6" fill="#50535B">开场:暖 · 高饱和</text>
        <text x="310" y="86" font-size="6.6" fill="#50535B" text-anchor="end">结局:冷 · 低饱和</text>
        <text x="165" y="40" font-size="6.6" fill="#8A8D94" text-anchor="middle">例:希望逐渐失落的故事 → 色彩随剧情降温脱饱和</text>
        <defs>
          <linearGradient id="arc2" x1="0" x2="1">
            <stop offset="0" stop-color="#6B7280"/><stop offset="0.55" stop-color="#8B8570"/>
            <stop offset="0.8" stop-color="#D08A2E"/><stop offset="1" stop-color="#E06A1F"/>
          </linearGradient>
        </defs>
        <rect x="20" y="118" width="290" height="26" fill="url(#arc2)"/>
        <text x="20" y="158" font-size="6.6" fill="#50535B">开场:灰 · 低饱和</text>
        <text x="310" y="158" font-size="6.6" fill="#50535B" text-anchor="end">结局:暖 · 点燃</text>
        <text x="165" y="112" font-size="6.6" fill="#8A8D94" text-anchor="middle">例:压抑走向救赎的故事 → 颜色随人物一起"活过来"</text>
        <text x="20" y="180" font-size="6.4" fill="#8A8D94">研究入口:电影的 movie barcode(整部电影逐帧压缩成一条色带)</text>
      </svg>
