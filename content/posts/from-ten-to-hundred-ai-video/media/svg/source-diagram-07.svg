<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 330 150" style="width:100%; border:.35mm solid var(--ink); background:#fff;">
<rect id="original-paper-backplate" x="0" y="0" width="330" height="150" fill="#ffffff"/>
        <text x="14" y="20" font-size="9" font-weight="700" letter-spacing="2">调色的两级工序</text>
        <rect x="20" y="40" width="130" height="64" fill="#F5E6F0" stroke="#A93A8C" stroke-width="1.2"/>
        <text x="30" y="58" font-size="8.5" font-weight="700">① 一级 · 校正</text>
        <text x="30" y="72" font-size="6.6" fill="#50535B">曝光 · 白平衡 · 对比</text>
        <text x="30" y="83" font-size="6.6" fill="#50535B">多镜头统一基准</text>
        <text x="30" y="97" font-size="6.4" fill="#8A8D94">目标:正确</text>
        <path d="M 152 72 L 176 72" stroke="#1B1D22" stroke-width="1.6" marker-end="url(#ar3)"/>
        <defs><marker id="ar3" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#1B1D22"/></marker></defs>
        <rect x="180" y="40" width="130" height="64" fill="#A93A8C"/>
        <text x="190" y="58" font-size="8.5" font-weight="700" fill="#fff">② 二级 · 风格</text>
        <text x="190" y="72" font-size="6.6" fill="#F5E6F0">Look · 局部 · 肤色保护</text>
        <text x="190" y="83" font-size="6.6" fill="#F5E6F0">LUT = 风格的封装</text>
        <text x="190" y="97" font-size="6.4" fill="#E8C8DE">目标:有态度</text>
        <text x="20" y="128" font-size="6.6" fill="#50535B">辅助仪表:示波器 / 直方图 —— 眼睛会骗人(受屏幕与环境光影响),波形不会。</text>
        <text x="20" y="139" font-size="6.6" fill="#8A8D94">入门可先不碰,但要走专业调色,它们是绕不开的下一站。</text>
      </svg>
