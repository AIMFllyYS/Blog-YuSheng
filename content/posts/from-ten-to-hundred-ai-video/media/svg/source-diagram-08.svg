<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 210" style="width:100%; border:.35mm solid var(--ink); background:#fff;">
<rect id="original-paper-backplate" x="0" y="0" width="720" height="210" fill="#ffffff"/>
    <text x="14" y="20" font-size="9" font-weight="700" letter-spacing="2">五级景别 · 信息 → 情绪的滑杆</text>
    <!-- 人形函数:五档 -->
    <g stroke="#1B1D22" fill="none" stroke-width="1.5">
      <!-- 远景 -->
      <g transform="translate(30,36)">
        <rect x="0" y="0" width="118" height="118" fill="#E5EBF5" stroke="#2E5FA3" stroke-width="1.2"/>
        <path d="M 8 96 L 40 60 L 62 78 L 88 44 L 112 70" stroke="#8A8D94" stroke-width="1"/>
        <g transform="translate(56,72) scale(0.34)"><circle cx="0" cy="-28" r="8"/><line x1="0" y1="-20" x2="0" y2="8"/><line x1="0" y1="-12" x2="-12" y2="2"/><line x1="0" y1="-12" x2="12" y2="2"/><line x1="0" y1="8" x2="-9" y2="30"/><line x1="0" y1="8" x2="9" y2="30"/></g>
        <text x="8" y="136" font-size="8.5" font-weight="700" stroke="none" fill="#1B1D22">远景 · 全貌</text>
        <text x="8" y="148" font-size="6.4" stroke="none" fill="#50535B">在哪里 · 定场镜头</text>
        <text x="8" y="158" font-size="6.4" stroke="none" fill="#50535B">人是环境的一部分</text>
      </g>
      <!-- 全景 -->
      <g transform="translate(166,36)">
        <rect x="0" y="0" width="118" height="118" fill="#EDF1F8" stroke="#2E5FA3" stroke-width="1.2"/>
        <g transform="translate(59,62) scale(0.78)"><circle cx="0" cy="-28" r="8"/><line x1="0" y1="-20" x2="0" y2="8"/><line x1="0" y1="-12" x2="-12" y2="2"/><line x1="0" y1="-12" x2="12" y2="2"/><line x1="0" y1="8" x2="-9" y2="30"/><line x1="0" y1="8" x2="9" y2="30"/></g>
        <text x="8" y="136" font-size="8.5" font-weight="700" stroke="none" fill="#1B1D22">全景 · 全身</text>
        <text x="8" y="148" font-size="6.4" stroke="none" fill="#50535B">姿态与动作 · 走位可见</text>
        <text x="8" y="158" font-size="6.4" stroke="none" fill="#50535B">表演=肢体</text>
      </g>
      <!-- 中景 -->
      <g transform="translate(302,36)">
        <rect x="0" y="0" width="118" height="118" fill="#F4F6FA" stroke="#2E5FA3" stroke-width="1.2"/>
        <g transform="translate(59,84) scale(1.35)"><circle cx="0" cy="-28" r="8"/><line x1="0" y1="-20" x2="0" y2="8"/><line x1="0" y1="-12" x2="-12" y2="2"/><line x1="0" y1="-12" x2="12" y2="2"/></g>
        <text x="8" y="136" font-size="8.5" font-weight="700" stroke="none" fill="#1B1D22">中景 · 半身</text>
        <text x="8" y="148" font-size="6.4" stroke="none" fill="#50535B">对话主力景别</text>
        <text x="8" y="158" font-size="6.4" stroke="none" fill="#50535B">关系与手势</text>
      </g>
      <!-- 近景 -->
      <g transform="translate(438,36)">
        <rect x="0" y="0" width="118" height="118" fill="#FAFBFD" stroke="#2E5FA3" stroke-width="1.2"/>
        <g transform="translate(59,104) scale(2.1)"><circle cx="0" cy="-28" r="8"/><line x1="0" y1="-20" x2="0" y2="-2"/><line x1="0" y1="-14" x2="-11" y2="-6"/><line x1="0" y1="-14" x2="11" y2="-6"/></g>
        <text x="8" y="136" font-size="8.5" font-weight="700" stroke="none" fill="#1B1D22">近景 · 胸上</text>
        <text x="8" y="148" font-size="6.4" stroke="none" fill="#50535B">表情开始主导</text>
        <text x="8" y="158" font-size="6.4" stroke="none" fill="#50535B">亲近感建立</text>
      </g>
      <!-- 特写 -->
      <g transform="translate(574,36)">
        <rect x="0" y="0" width="118" height="118" fill="#2E5FA3"/>
        <g transform="translate(59,92) scale(3.6)" stroke="#FBFBF8"><circle cx="0" cy="-14" r="9"/></g>
        <circle cx="52" cy="72" r="2.6" fill="#FBFBF8" stroke="none"/><circle cx="66" cy="72" r="2.6" fill="#FBFBF8" stroke="none"/>
        <text x="8" y="136" font-size="8.5" font-weight="700" stroke="none" fill="#1B1D22">特写 · 面部/局部</text>
        <text x="8" y="148" font-size="6.4" stroke="none" fill="#50535B">纯情绪 · 心理时刻</text>
        <text x="8" y="158" font-size="6.4" stroke="none" fill="#50535B">省着用,才有力量</text>
      </g>
    </g>
    <!-- 滑杆 -->
    <path d="M 40 190 L 680 190" stroke="#8A8D94" stroke-width="1"/>
    <text x="40" y="204" font-size="6.8" fill="#50535B">◀ 信息 · 客观 · 交代</text>
    <text x="680" y="204" font-size="6.8" fill="#50535B" text-anchor="end">情绪 · 主观 · 冲击 ▶</text>
  </svg>
