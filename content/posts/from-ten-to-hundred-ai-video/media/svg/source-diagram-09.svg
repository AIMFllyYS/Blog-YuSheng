<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 330 240" style="width:100%; border:.35mm solid var(--ink); background:#fff;">
<rect id="original-paper-backplate" x="0" y="0" width="330" height="240" fill="#ffffff"/>
        <text x="14" y="20" font-size="9" font-weight="700" letter-spacing="2">180° 轴线 · 俯视图</text>
        <!-- 轴线 -->
        <line x1="40" y1="105" x2="290" y2="105" stroke="#BE3A2B" stroke-width="1.6" stroke-dasharray="6 4"/>
        <text x="294" y="108" font-size="6.5" fill="#BE3A2B">轴线</text>
        <!-- 两人 -->
        <circle cx="110" cy="105" r="13" fill="#2E5FA3"/><text x="110" y="109" font-size="7.5" fill="#fff" text-anchor="middle">A</text>
        <circle cx="220" cy="105" r="13" fill="#1B1D22"/><text x="220" y="109" font-size="7.5" fill="#fff" text-anchor="middle">B</text>
        <!-- 安全区弧 -->
        <path d="M 45 105 A 120 92 0 0 1 285 105" fill="none" stroke="#8A8D94" stroke-width="1" stroke-dasharray="2 3" transform="translate(0,0) scale(1,-1) translate(0,-210)"/>
        <!-- 机位1/2 -->
        <g transform="translate(88,178)"><rect x="-11" y="0" width="22" height="13" fill="none" stroke="#17858A" stroke-width="1.4"/><path d="M 0 0 L -6 -7 L 6 -7 Z" fill="#17858A"/><text x="0" y="26" font-size="6.5" text-anchor="middle" fill="#17858A">机位 1 · 拍 B(越 A 肩)</text></g>
        <g transform="translate(242,178)"><rect x="-11" y="0" width="22" height="13" fill="none" stroke="#17858A" stroke-width="1.4"/><path d="M 0 0 L -6 -7 L 6 -7 Z" fill="#17858A"/><text x="0" y="26" font-size="6.5" text-anchor="middle" fill="#17858A">机位 2 · 拍 A(越 B 肩)</text></g>
        <path d="M 95 176 L 200 122" stroke="#17858A" stroke-width=".8" stroke-dasharray="2 2"/>
        <path d="M 235 176 L 130 122" stroke="#17858A" stroke-width=".8" stroke-dasharray="2 2"/>
        <!-- 禁区机位 -->
        <g transform="translate(165,44)"><rect x="-11" y="0" width="22" height="13" fill="none" stroke="#BE3A2B" stroke-width="1.4"/><path d="M 0 13 L -6 20 L 6 20 Z" fill="#BE3A2B"/><line x1="-16" y1="-4" x2="16" y2="17" stroke="#BE3A2B" stroke-width="1.6"/><text x="0" y="-8" font-size="6.5" text-anchor="middle" fill="#BE3A2B">越轴 = 方位跳变,观众迷失</text></g>
        <text x="20" y="228" font-size="6.5" fill="#50535B">同侧机位内:A 永远看向右,B 永远看向左 —— 空间关系稳定。</text>
      </svg>
