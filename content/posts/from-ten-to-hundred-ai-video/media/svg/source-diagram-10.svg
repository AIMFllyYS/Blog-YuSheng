<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 218" style="width:100%; border:.35mm solid var(--ink); background:#fff;">
<rect id="original-paper-backplate" x="0" y="0" width="720" height="218" fill="#ffffff"/>
    <text x="14" y="22" font-size="9" font-weight="700" letter-spacing="2">六大要素与它们的权重</text>
    <g font-size="8">
      <rect x="120" y="40"  width="510" height="19" fill="#17858A"/><text x="20" y="53" font-weight="700">情绪 51%</text><text x="128" y="53" fill="#fff">这一剪让观众感到了该感到的吗?情绪相同的场景可以直接衔接;剪辑手段可烘托情绪(快剪强化焦躁)</text>
      <rect x="120" y="66"  width="230" height="19" fill="#3AA0A3"/><text x="20" y="79" font-weight="700">故事 23%</text><text x="128" y="79" fill="#fff">这一剪推进叙事了吗?前后片段成组产生关联;跳过冗余</text>
      <rect x="120" y="92"  width="100" height="19" fill="#6FBCBE"/><text x="20" y="105" font-weight="700">节奏 10%</text><text x="226" y="105" fill="#1B1D22">切在"有趣且合理"的时刻——不完全等于踩音乐点</text>
      <rect x="120" y="118" width="70"  height="19" fill="#9DD2D3"/><text x="20" y="131" font-weight="700">视线追踪 7%</text><text x="196" y="131" fill="#1B1D22">观众此刻在看画面哪里?下一镜的兴趣点要接得住;一切皆静就看动的</text>
      <rect x="120" y="144" width="50"  height="19" fill="#C3E4E5"/><text x="20" y="157" font-weight="700">二维平面 5%</text><text x="176" y="157" fill="#1B1D22">轴线与方向匹配:目光方向、运动方向在屏幕上连续</text>
      <rect x="120" y="170" width="40"  height="19" fill="#DFF1F1"/><text x="20" y="183" font-weight="700">三维空间 4%</text><text x="166" y="183" fill="#1B1D22">地理位置清晰:适时剪入关系镜头,为观众开拓视野</text>
    </g>
    <text x="20" y="207" font-size="6.6" fill="#8A8D94">权重的含义:下面的规则可以为上面的规则让路。为了情绪,可以越轴;为了轴线,不许杀情绪。研究入口:Walter Murch《眨眼之间》。</text>
  </svg>
