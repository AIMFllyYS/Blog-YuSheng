<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 330 150" style="width:100%; border:.35mm solid var(--ink); background:#fff;">
<rect id="original-paper-backplate" x="0" y="0" width="330" height="150" fill="#ffffff"/>
        <text x="14" y="18" font-size="9" font-weight="700" letter-spacing="2">J cut / L cut · 时间轴</text>
        <!-- J cut -->
        <text x="20" y="40" font-size="7.5" font-weight="700">J cut:声音先行</text>
        <rect x="20" y="46" width="130" height="14" fill="#C3E4E5"/><text x="26" y="56" font-size="6.5">镜头 A 画面</text>
        <rect x="150" y="46" width="140" height="14" fill="#17858A"/><text x="156" y="56" font-size="6.5" fill="#fff">镜头 B 画面</text>
        <rect x="20" y="62" width="90" height="12" fill="#E0F0F0"/><text x="26" y="71" font-size="6.2">A 声音</text>
        <rect x="110" y="62" width="180" height="12" fill="#0F5E61"/><text x="116" y="71" font-size="6.2" fill="#fff">B 声音提前进入 ——"耳朵先到"</text>
        <!-- L cut -->
        <text x="20" y="98" font-size="7.5" font-weight="700">L cut:声音滞留</text>
        <rect x="20" y="104" width="140" height="14" fill="#C3E4E5"/><text x="26" y="114" font-size="6.5">镜头 A 画面</text>
        <rect x="160" y="104" width="130" height="14" fill="#17858A"/><text x="166" y="114" font-size="6.5" fill="#fff">镜头 B 画面</text>
        <rect x="20" y="120" width="200" height="12" fill="#E0F0F0"/><text x="26" y="129" font-size="6.2">A 声音延续到 B 的画面上 ——"余音未了"</text>
        <rect x="220" y="120" width="70" height="12" fill="#0F5E61"/><text x="226" y="129" font-size="6.2" fill="#fff">B 声音</text>
      </svg>
