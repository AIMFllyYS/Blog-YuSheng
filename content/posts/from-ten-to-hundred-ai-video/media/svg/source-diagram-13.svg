<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 158" style="width:100%; border:.35mm solid var(--ink); background:#fff;">
<rect id="original-paper-backplate" x="0" y="0" width="720" height="158" fill="#ffffff"/>
    <text x="14" y="20" font-size="9" font-weight="700" letter-spacing="2">真实感的声学配方:三层叠加</text>
    <rect x="20"  y="34" width="680" height="30" fill="#E7F0E4"/><text x="30" y="47" font-size="8" font-weight="700">① 环境层 AMBIENCE(常开)</text><text x="30" y="58" font-size="6.8" fill="#50535B">房间底噪 · 街道人声 · 风与虫鸣 —— 每个场景都该有的"空气声"。没有它,画面像贴在真空里;换场景必换环境声。</text>
    <rect x="20"  y="70" width="680" height="30" fill="#CBE2C5"/><text x="30" y="83" font-size="8" font-weight="700">② 动作层 FOLEY(跟随画面)</text><text x="30" y="94" font-size="6.8" fill="#50535B">脚步 · 开门 · 衣料摩擦 · 放杯子 —— 画面里每个动作都应有对应声响。AI 生成画面天生无声,动作层是"补魂"工序。</text>
    <rect x="20"  y="106" width="680" height="30" fill="#4C8440"/><text x="30" y="119" font-size="8" font-weight="700" fill="#fff">③ 强调层 ACCENT(点睛)</text><text x="30" y="130" font-size="6.8" fill="#DDEBD8">whoosh 转场声 · 重音 hit · 心跳 · 上扬提示音 —— 服务剪辑与情绪的"设计音",宁缺毋滥。</text>
    <text x="20" y="152" font-size="6.6" fill="#8A8D94">自查:关掉 BGM 只听你的片子——还剩下什么?只剩台词,就是三层全缺。</text>
  </svg>
