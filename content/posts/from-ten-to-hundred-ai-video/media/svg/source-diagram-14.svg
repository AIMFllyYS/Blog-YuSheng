<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 330 240" style="width:100%; border:.35mm solid var(--ink); background:#fff;">
<rect id="original-paper-backplate" x="0" y="0" width="330" height="240" fill="#ffffff"/>
        <text x="14" y="20" font-size="9" font-weight="700" letter-spacing="2">复刻阶梯 · 难度递增</text>
        <!-- 阶梯 -->
        <rect x="20" y="176" width="150" height="42" fill="#F1F1EB" stroke="#1B1D22" stroke-width="1"/>
        <text x="28" y="192" font-size="8" font-weight="700">第一级 · 陈翔六点半</text>
        <text x="28" y="204" font-size="6.4" fill="#50535B">单场景 · 少人物 · 对话驱动</text>
        <text x="28" y="213" font-size="6.4" fill="#50535B">全要素齐备,复杂度全部可控</text>
        <rect x="100" y="112" width="150" height="42" fill="#DDDDD6" stroke="#1B1D22" stroke-width="1"/>
        <text x="108" y="128" font-size="8" font-weight="700">第二级 · 高级宣传片</text>
        <text x="108" y="140" font-size="6.4" fill="#50535B">质感统治:光线 · 色彩 · 长焦</text>
        <text x="108" y="149" font-size="6.4" fill="#50535B">难点从叙事转向美学一致性</text>
        <rect x="180" y="48" width="150" height="42" fill="#1B1D22"/>
        <text x="188" y="64" font-size="8" font-weight="700" fill="#FBFBF8">第三级 · 电影片段复刻</text>
        <text x="188" y="76" font-size="6.4" fill="#DDDDD6">多场景调度 · 复杂表演层次</text>
        <text x="188" y="85" font-size="6.4" fill="#DDDDD6">六维全开,难度全开</text>
        <path d="M 172 190 L 96 148" stroke="#8A8D94" stroke-width="1" marker-end="url(#ar9)"/>
        <path d="M 252 126 L 176 84" stroke="#8A8D94" stroke-width="1" marker-end="url(#ar9)"/>
        <defs><marker id="ar9" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#8A8D94"/></marker></defs>
        <text x="20" y="234" font-size="6.4" fill="#8A8D94">原则:在一级没拿到及格分之前,不要垫脚去够二级。</text>
      </svg>
