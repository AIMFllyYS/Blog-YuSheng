<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" style="width:100%; border:.35mm solid var(--ink); background:#fff;">
<rect id="original-paper-backplate" x="0" y="0" width="720" height="330" fill="#ffffff"/>
    <defs><marker id="arp" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#50535B"/></marker></defs>
    <text x="14" y="22" font-size="9" font-weight="700" letter-spacing="2">生产管线 × 知识注入点</text>
    <!-- 管线主干 -->
    <g font-size="7.5">
      <rect x="20" y="44" width="94" height="34" fill="#1B1D22"/><text x="30" y="58" fill="#fff" font-weight="700">① 剧本</text><text x="30" y="70" fill="#DDDDD6" font-size="6.3">故事 · 台词 · 潜台词</text>
      <rect x="138" y="44" width="94" height="34" fill="#1B1D22"/><text x="148" y="58" fill="#fff" font-weight="700">② 分镜表</text><text x="148" y="70" fill="#DDDDD6" font-size="6.3">全书知识的落盘处</text>
      <rect x="256" y="44" width="94" height="34" fill="#1B1D22"/><text x="266" y="58" fill="#fff" font-weight="700">③ 首帧/参考图</text><text x="266" y="70" fill="#DDDDD6" font-size="6.3">构图与美术定稿</text>
      <rect x="374" y="44" width="94" height="34" fill="#1B1D22"/><text x="384" y="58" fill="#fff" font-weight="700">④ 视频生成</text><text x="384" y="70" fill="#DDDDD6" font-size="6.3">运镜 · 表演驱动</text>
      <rect x="492" y="44" width="94" height="34" fill="#1B1D22"/><text x="502" y="58" fill="#fff" font-weight="700">⑤ 配音 TTS</text><text x="502" y="70" fill="#DDDDD6" font-size="6.3">声音表演</text>
      <rect x="610" y="44" width="94" height="34" fill="#1B1D22"/><text x="620" y="58" fill="#fff" font-weight="700">⑥ 剪辑合成</text><text x="620" y="70" fill="#DDDDD6" font-size="6.3">组接 · 节奏</text>
      <path d="M 114 61 L 134 61" stroke="#50535B" stroke-width="1.4" marker-end="url(#arp)"/>
      <path d="M 232 61 L 252 61" stroke="#50535B" stroke-width="1.4" marker-end="url(#arp)"/>
      <path d="M 350 61 L 370 61" stroke="#50535B" stroke-width="1.4" marker-end="url(#arp)"/>
      <path d="M 468 61 L 488 61" stroke="#50535B" stroke-width="1.4" marker-end="url(#arp)"/>
      <path d="M 586 61 L 606 61" stroke="#50535B" stroke-width="1.4" marker-end="url(#arp)"/>
      <!-- 第二排 -->
      <rect x="610" y="108" width="94" height="34" fill="#1B1D22"/><text x="620" y="122" fill="#fff" font-weight="700">⑦ 调色</text><text x="620" y="134" fill="#DDDDD6" font-size="6.3">一级 → 二级</text>
      <rect x="492" y="108" width="94" height="34" fill="#1B1D22"/><text x="502" y="122" fill="#fff" font-weight="700">⑧ 声音设计</text><text x="502" y="134" fill="#DDDDD6" font-size="6.3">三层音效 · 混音</text>
      <rect x="374" y="108" width="94" height="34" fill="#1B1D22"/><text x="384" y="122" fill="#fff" font-weight="700">⑨ 成片</text><text x="384" y="134" fill="#DDDDD6" font-size="6.3">字幕 · 发布</text>
      <path d="M 657 82 L 657 104" stroke="#50535B" stroke-width="1.4" marker-end="url(#arp)"/>
      <path d="M 606 125 L 590 125" stroke="#50535B" stroke-width="1.4" marker-end="url(#arp)"/>
      <path d="M 488 125 L 472 125" stroke="#50535B" stroke-width="1.4" marker-end="url(#arp)"/>
    </g>
    <!-- 注入标注 -->
    <g font-size="6.5">
      <rect x="20" y="170" width="680" height="146" fill="#F1F1EB"/>
      <text x="30" y="186" font-size="7.5" font-weight="700" letter-spacing="1.5">各节点的知识注入</text>
      <text x="30" y="203"><tspan font-weight="700" fill="#BE3A2B">① 剧本</tspan> ← 表演即信息 1.1(为台词写潜台词与状态)· 让 AI 体验角色 1.6</text>
      <text x="30" y="218"><tspan font-weight="700" fill="#2E5FA3">② 分镜表</tspan> ← 全书汇聚点:每行 = 景别 4.1 + 构图 4.2 + 运镜 4.3 + 光线 2.2 + 色调 3.3 + 表演通道 CH1 + 音效预埋 6.2 —— 分镜表就是"被表格化的专业知识"</text>
      <text x="30" y="233"><tspan font-weight="700" fill="#A8790A">③ 首帧/参考图</tspan> ← 场景小传 2.1 · 一致性锚点 2.3.2 · 三分/前景/框架构图 4.2 · 配色方案 3.2</text>
      <text x="30" y="248"><tspan font-weight="700" fill="#2E5FA3">④ 视频生成</tspan> ← 运镜词表 4.3 · 焦段透视 4.6 · 表演描述词库 1.2–1.4 · 方位锁定(正反打)4.5</text>
      <text x="30" y="263"><tspan font-weight="700" fill="#BE3A2B">⑤ 配音</tspan> ← 声音表演五参数 1.5 · 空间混响匹配 6.3</text>
      <text x="30" y="278"><tspan font-weight="700" fill="#17858A">⑥ 剪辑</tspan> ← 六大要素 5.1 · 硬切三门派 5.2 · J/L cut 5.3 · 蒙太奇 5.4 · 节奏曲线 5.5 · 卡点 5.6 · 基元 5.7</text>
      <text x="30" y="293"><tspan font-weight="700" fill="#A93A8C">⑦ 调色</tspan> ← 一级校正 3.5.1 → 二级风格 3.5.2 · 色彩弧线核对 3.3   <tspan font-weight="700" fill="#4C8440">⑧ 声音设计</tspan> ← 三层音效 6.2 · BGM 进出点 6.1 · 静默 6.4 · 声画对位 6.5</text>
      <text x="30" y="308" fill="#50535B">未来趋势:AI 可能把 ④–⑧ 逐步融合(工作流足够好时,理论上可直接产出无需剪辑的成片)——但融合掉的是工序,不是知识:知识只是换了个注入口。</text>
    </g>
  </svg>
