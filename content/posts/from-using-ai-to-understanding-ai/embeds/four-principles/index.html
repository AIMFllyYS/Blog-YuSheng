<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI 时代的四点</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: "Source Han Serif SC", "Noto Serif SC", "Songti SC", serif;
        background: #f4ead3;
        color: #2c2416;
      }
      main {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: .7rem;
        padding: .9rem;
      }
      article {
        background: #fbf6ea;
        border: 1px solid #d8c9a4;
        border-radius: .7rem;
        padding: .75rem .8rem .85rem;
        min-height: 7.2rem;
      }
      span {
        display: block;
        font-size: .7rem;
        letter-spacing: .14em;
        color: #7a4a28;
        margin-bottom: .35rem;
      }
      h2 {
        margin: 0 0 .35rem;
        font-size: .95rem;
        font-weight: 600;
      }
      p {
        margin: 0;
        font-size: .78rem;
        line-height: 1.55;
        color: #4a3f2e;
      }
      @media (max-width: 520px) {
        main { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <main>
      <article>
        <span>01</span>
        <h2>保持警惕</h2>
        <p>模型是概率预测。长对话和科研场景里，仍要批判性地审每一段生成文字。</p>
      </article>
      <article>
        <span>02</span>
        <h2>找到节奏</h2>
        <p>慢就是快。不被浪潮裹着走，把时间花在专业化，而不是浅层跟风。</p>
      </article>
      <article>
        <span>03</span>
        <h2>自己的标准</h2>
        <p>素材太多时，用标准检索和衡量。返工堆叠不一定等于赋能。</p>
      </article>
      <article>
        <span>04</span>
        <h2>复盘封装</h2>
        <p>每做完一件事提炼 SOP，收成 Skills，把不确定的边界收缩清楚。</p>
      </article>
    </main>
    <script>
      (() => {
        const nonce = new URLSearchParams(location.hash.slice(1)).get('nonce')
        if (nonce) parent.postMessage({ nonce, message: { type: 'ready' } }, '*')
        const reportHeight = () => {
          parent.postMessage(
            { type: 'resize', height: document.documentElement.scrollHeight },
            '*',
          )
        }
        requestAnimationFrame(reportHeight)
        new ResizeObserver(reportHeight).observe(document.documentElement)
      })()
    </script>
  </body>
</html>
