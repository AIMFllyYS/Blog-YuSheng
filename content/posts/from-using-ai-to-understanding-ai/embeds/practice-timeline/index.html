<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>一年实践时间线</title>
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: "Source Han Serif SC", "Noto Serif SC", "Songti SC", serif;
        background: #f4ead3;
        color: #2c2416;
      }
      main { padding: 1rem 1.1rem 1.2rem; }
      h1 {
        margin: 0 0 .85rem;
        font-size: 1.05rem;
        font-weight: 600;
        letter-spacing: .04em;
      }
      ol {
        list-style: none;
        margin: 0;
        padding: 0;
        border-left: 2px solid #cbb892;
      }
      li {
        position: relative;
        padding: .15rem 0 .85rem 1.15rem;
      }
      li::before {
        content: "";
        position: absolute;
        left: -.42rem;
        top: .45rem;
        width: .65rem;
        height: .65rem;
        border-radius: 50%;
        background: #7a4a28;
        box-shadow: 0 0 0 3px #f4ead3;
      }
      time {
        display: block;
        font-size: .72rem;
        letter-spacing: .08em;
        color: #7a6a4e;
      }
      strong { font-size: .95rem; }
      p {
        margin: .2rem 0 0;
        font-size: .82rem;
        line-height: 1.55;
        color: #4a3f2e;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>从网页到产品：一条实践时间线</h1>
      <ol>
        <li>
          <time>2025 · 08 前后</time>
          <strong>HTML 把文章变成可读的页</strong>
          <p>AI 编程的第一扇门：纯文本变成可交互的前端。</p>
        </li>
        <li>
          <time>大一上后期</time>
          <strong>读书会网站 · 长征 3D · 中药路演</strong>
          <p>课余活动里最直观的三张「能扫码、能打开」的页面。</p>
        </li>
        <li>
          <time>2025 年末</time>
          <strong>1037Solo 资源平台</strong>
          <p>从单页网站走进真正复杂的全栈项目。</p>
        </li>
        <li>
          <time>此后</time>
          <strong>课堂笔记产品 · 期末复习站</strong>
          <p>把散落的转录、出题、讲解收成自己的学习系统。</p>
        </li>
      </ol>
    </main>
    <script>
      (() => {
        const nonce = new URLSearchParams(location.hash.slice(1)).get('nonce')
        if (nonce) {
          parent.postMessage({ nonce, message: { type: 'ready' } }, '*')
        }
        const reportHeight = () => {
          parent.postMessage(
            { type: 'resize', height: document.documentElement.scrollHeight },
            '*',
          )
        }
        requestAnimationFrame(reportHeight)
        new ResizeObserver(reportHeight).observe(document.documentElement)
      })()
    </script>
  </body>
</html>
