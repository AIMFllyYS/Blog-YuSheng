*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.8 "Noto Serif CJK","Source Han Serif SC","Songti SC",SimSun,serif}main{padding:clamp(20px,5vw,42px);max-width:1080px;margin:auto}h1,h2,p{margin:0}h1{font-weight:500;font-size:clamp(24px,5vw,40px);line-height:1.35;letter-spacing:.04em;margin:8px 0 14px}h2{font-weight:500;font-size:22px}.eyebrow{font:11px/1.5 Consolas,monospace;letter-spacing:.18em;text-transform:uppercase;color:var(--accent)}.intro,.caption{color:var(--muted);font-size:13px}.caption{margin-top:18px;border-top:1px solid var(--line);padding-top:12px}button,input,select{font:inherit}button{cursor:pointer;border:1px solid var(--line);background:transparent;color:var(--ink);padding:9px 16px;min-height:44px;transition:background .3s,color .3s}button:hover,button[aria-pressed=true]{background:var(--ink);color:var(--paper)}button:disabled{opacity:.45;cursor:default}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:4px}input[type=range]{width:100%;accent-color:var(--accent)}.controls{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}.readout{border-left:2px solid var(--accent);padding:8px 0 8px 20px;margin-top:20px;min-height:80px}.readout p{white-space:pre-wrap}.readout small{color:var(--muted)}svg,canvas{max-width:100%;display:block}blockquote{margin:0;white-space:pre-wrap}details{margin-top:18px}summary{cursor:pointer;color:var(--accent);min-height:44px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:13px/1.8 Consolas,monospace}.theme{float:right;font-size:12px;padding:3px 10px;min-height:34px}

@media(prefers-color-scheme:dark){:root:not([data-theme=paper]){--paper:#171b1c;--ink:#e9e4d8;--muted:#b6b1a6;--line:#444846;--accent:#deb47d;--wash:#293333}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

.spool{display:flex;overflow-x:auto;gap:0;padding:26px 0 18px;scrollbar-width:thin}.spool button{flex:0 0 138px;text-align:left;border:0;border-bottom:2px solid var(--line);border-right:1px solid var(--line);font-size:12px;padding:14px;position:relative}.spool b{display:block;font:28px Georgia,serif;margin-bottom:12px;color:var(--accent)}.spool button[aria-pressed=true]{border-bottom-color:var(--accent)}.memory{padding:22px 0;max-height:350px;overflow:auto}.memory h2{font-size:18px;margin-bottom:16px}.memory blockquote{font-size:15px}</style></head>
<body><main><button class="theme" data-theme-toggle aria-label="切换小页明暗主题">明 / 暗</button><div class="eyebrow">MEMORY SPOOL / SUMMER 2025</div><h1>沿着记忆倒带</h1><p class="intro">这些时间节点严格按文章里的出现顺序排列。点击一个刻度，回看它后面的原句，不把倒叙改成顺叙。</p>

document.querySelector('[data-theme-toggle]').addEventListener('click',()=>{const dark=getComputedStyle(document.documentElement).getPropertyValue('--paper').trim()==='#171b1c';document.documentElement.dataset.theme=dark?'paper':'night';window.dispatchEvent(new Event('themechange'))})

const memories=[{"label": "倒计时20天，目标-哈工程", "text": "当最后一节课的铃声振入曾经已经麻木的心灵深处，当转运rna的三叶草，一条条开过光的红绳，一个个可爱的小挂件，永远的定格佩戴在那一天的清晨，灵魂或许仅剩停止推演的解析几何，但一致的是，每个人的全身契合着最终努力拼搏的班级的气息，人生的方向就此展开"}, {"label": "倒计时100天，目标-哈工大", "text": "当百日誓师的呐喊声掀开九中教学楼，冲入云霄，追逐着成人礼的自由飞翔的气球，引领我们在这未来的100天内，走向前方的迷途，我们斗志昂扬，我们群情激愤，我们坚信，胜利终将属于我们"}, {"label": "倒计时一两百天左右，目标-哈工威", "text": "当\"青丝可否对白发\"的一句歌词萦绕在教室每个人眼前的小蛋糕前，当可爱的语文老师举着相机，\"咔嚓\"住手捧着欢庆礼物，在语文战场上凯旋而归的豪杰们时，曾经的那一份小小的温馨？也许我们的笔袋里还定格着那一支独属于我们的青春纪念罢。我们手捧星辰，去独自探寻前行的一条条路，去感怀曾经的每一位老师，也许当楼下的那一束鲜花，在生物领域绽放的刹那，那是崔老师悄然落下的不舍得眼泪吧，那片记忆中凝结的是那一大束鲜花前的晶莹的泪滴吧。曾记得夏日里的一根根冰棍，融化在老师们对教育奉献的无穷热烈之中，亦或幽默风趣而又调理清晰，3班学子不甘于松北A班，更不甘于江南的c班，猛虎带着我们向前冲去，突破学校的桎梏，重新步入新的化学高度...台下着我们，向前方远眺，视线越过一个个板块与传送带，来到了无尽的天体宇宙，来到了最初的受力分析，在徐老师徐徐的语言中，领悟到了人生的那一份份哲理（重力＆人性），磁性的声音中，不只是那一片对教育的赤诚，也不仅是那口中动人的物理规律，更闪烁着母性的光辉......老师们头脑包罗万象，而心胸也包容天地，纵使时而的斥责使人感动的潸然泪下，可无悔那一场青春对知识的感悟与师生情谊的无法割舍！"}, {"label": "倒计时365天，目标-浙江大学", "text": "当一位位新的大咖老师重新入驻，推开这的语文和生物的众妙之门，浩如烟海的新的知识跃上纸面，随着老师们深入浅出而又奥妙无穷的言语，冲破这缠绕在我们身周的知识的避垒：阅读也有逻辑，文言更有实词，我们重新探寻中国古代的文学积累；分子与细胞，遗传与进化，稳态与调节，生物与环境，伴随着生物技术与工程，融入在周身的每一份呼吸，演绎着生命无穷的魅力，道生一，一生二，二生三，三生万物，而生物可生万物！"}, {"label": "倒计时400天左右，目标-吃喝玩乐", "text": "那是最后一场艺术节，也是最后一次体育节，当熟悉的3班队伍走上前去，地面恐怕也得跟着三声颤抖（懂的都懂），曾记得拔河前付老师的深深教诲，黑板上一个个的小人仍在记忆中玄腾飞跃，色彩格外鲜明而又寓意深刻（这里也是言有所指，但不是反讽，是正面的怀念哦），可高二的我们怎么能去追念高一的过去呢？仍是没心没肺的吃喝玩乐，感慨九中的食堂没有披萨（Li-Zn原电池的梗），更感慨的是，九中食堂的难以下咽和不要钱的豆油，不过最出名的当属是那最贵的食堂头衔罢。全员下跪的拔河，全凭运气排球，实力飞天的篮球，门捷列夫的足球，不一而足。"}, {"label": "倒计时720天左右，志向-清北复交", "text": "那一年真正走入校园不过半年光阴，那一年在一群文科生的超级加持下，3班从不比A＋班差半分，曾记得董老师手持天龙屠夫刀，秀一手起飞绝学；在班会课上，下尽了血本，只为祝愿前途无量；在某个深夜，巧然拎着一包零食，心中默默的祝愿...谁还记得当年的512心理游园会？谁还记得当年海底的合唱？在那个对高中充满无穷期待的美好时节，我们赏尽早晨的朝霞，在操场慰问大好的夕阳，在那操场的跑道和那充满生机的草坪上，定格着青春下一幅幅，仅停留在记忆中的怅然画面"}, {"label": "倒计时1057天，目标-松北九中", "text": "毕业季的阳光格外耀眼，我们追逐着梦想，迎着九中门前的第一缕阳光，来到了那一个报道的操场，我们东张西望，我们注视着老师在讲台上郑重的抽签"}, {"label": "倒计时0分0秒，位置-高考考场，前方-2小时30分倒计时。", "text": "每一处落笔，挥洒的是高中三年的汗水，笔尖画下的是积累的三年光阴知识，眼前连接的是高中三年的拼搏记忆，心中回荡的是老师们一句句叮咛的话语，还有那若隐若现的家长们的无尽祝福"}, {"label": "时间2025年6月9日18:15，目标-不论", "text": "考试结束时间已到，请考生立即停止答卷，按监考考试......."}];document.querySelectorAll("[data-memory]").forEach(b=>b.onclick=()=>{const i=Number(b.dataset.memory);document.querySelector("#memory-title").textContent=memories[i].label;document.querySelector("#memory-copy").textContent=memories[i].text;document.querySelectorAll("[data-memory]").forEach(n=>n.setAttribute("aria-pressed",String(n===b)));document.querySelector(".memory").scrollTop=0})</script></body></html>
