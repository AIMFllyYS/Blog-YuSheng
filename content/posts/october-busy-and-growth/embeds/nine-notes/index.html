<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>十月九条</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: "Source Han Serif SC", "Noto Serif SC", "Songti SC", serif;
        background: #f4ead3;
        color: #2c2416;
      }
      ol {
        list-style: none;
        margin: 0;
        padding: .85rem 1rem 1rem;
        display: grid;
        gap: .45rem;
      }
      li {
        display: grid;
        grid-template-columns: 1.6rem 1fr;
        gap: .55rem;
        font-size: .86rem;
        line-height: 1.45;
      }
      b {
        color: #7a4a28;
        font-size: .72rem;
        letter-spacing: .08em;
        padding-top: .12rem;
      }
    </style>
  </head>
  <body>
    <ol>
      <li><b>01</b><span>课下时间不够：上课内化，课间立刻复盘，睡眠是前提。</span></li>
      <li><b>02</b><span>百团与路演把组织能力推到临界，下一步要读书，也要认识「老家伙」。</span></li>
      <li><b>03</b><span>规划不能拆在两个软件三个界面里——催生自己的时间产品。</span></li>
      <li><b>04</b><span>越了解模型，越承认提示词与工作流的魅力，三个想法要落地。</span></li>
      <li><b>05</b><span>摄影剪辑入门之后，切忌停在表面，硬件开销会复利。</span></li>
      <li><b>06</b><span>摄影师身份能把门推开，本月因此进了两个组织。</span></li>
      <li><b>07</b><span>开源仍靠家教，生源稳定，以后想拉同学一起陪跑。</span></li>
      <li><b>08</b><span>写作重要：科幻投稿拿到大学第一笔奖金，科普论文初稿已定。</span></li>
      <li><b>09</b><span>十一月先回到学业和已经报名的比赛。</span></li>
    </ol>
  </body>
</html>
