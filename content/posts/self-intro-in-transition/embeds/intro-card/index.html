<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>中二自我介绍卡片</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: "Source Han Serif SC", "Noto Serif SC", "Songti SC", serif;
        background: #f4ead3;
        color: #2c2416;
      }
      main { padding: .9rem; }
      header { margin-bottom: .8rem; }
      h1 { margin: 0; font-size: 1.15rem; font-weight: 600; }
      p { margin: .25rem 0 0; font-size: .82rem; color: #7a6a4e; }
      dl {
        display: grid;
        grid-template-columns: 5.5rem 1fr;
        gap: .35rem .7rem;
        margin: 0;
        font-size: .88rem;
      }
      dt { color: #7a4a28; letter-spacing: .08em; font-size: .72rem; padding-top: .15rem; }
      dd { margin: 0; }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>孔德羽 · 羽升</h1>
        <p>华科基医强基 2501 · 黑龙江哈尔滨</p>
      </header>
      <dl>
        <dt>爱好</dt>
        <dd>摄影、剪辑、写作、研究 AI、MC、看科幻与玄幻</dd>
        <dt>MBTI</dt>
        <dd>ENFP</dd>
        <dt>理想</dt>
        <dd>修仙（认真的）</dd>
        <dt>追求</dt>
        <dd>拿诺奖</dd>
        <dt>目标</dt>
        <dd>科研，眼下是基因工程</dd>
      </dl>
    </main>
  </body>
</html>
