<svg viewBox="0 0 400 210" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">CIE 1931 色度图与常见色域示意</title>
  <desc id="desc">在人眼可见颜色范围内，Rec.2020、P3 或 Adobe RGB、sRGB 依次覆盖不同大小的三角形区域。</desc>
  <path d="M 60 190 Q 30 120 70 55 Q 130 -10 230 15 Q 330 40 380 130 L 340 190 Z" fill="#E4F3F7" stroke="#0E7490" stroke-width="1.5"/>
  <text x="200" y="105" text-anchor="middle" font-size="11" fill="#0E7490">人眼可见的全部颜色（马蹄图）</text>
  <polygon points="140,170 200,40 300,170" fill="none" stroke="#EA580C" stroke-width="2"/>
  <text x="300" y="185" text-anchor="middle" font-size="10" fill="#EA580C">Rec.2020</text>
  <polygon points="160,170 210,75 285,170" fill="none" stroke="#7C3AED" stroke-width="2"/>
  <text x="160" y="185" text-anchor="middle" font-size="10" fill="#7C3AED">P3 / Adobe RGB</text>
  <polygon points="185,168 225,105 268,168" fill="none" stroke="#DC2626" stroke-width="2"/>
  <text x="226" y="145" text-anchor="middle" font-size="10" fill="#DC2626">sRGB</text>
</svg>
