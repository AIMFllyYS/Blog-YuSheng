<svg viewBox="0 0 400 64" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">60-30-10 配色法则</title>
  <desc id="desc">主色约占六成视觉权重，辅色约占三成，强调色约占一成。</desc>
  <rect x="10" y="12" width="228" height="30" rx="4" fill="#E8E8E4"/>
  <rect x="238" y="12" width="114" height="30" fill="#9AA5B1"/>
  <rect x="352" y="12" width="38" height="30" rx="4" fill="#EA580C"/>
  <text x="124" y="32" text-anchor="middle" font-size="11" fill="#555">60% 主色（背景，安静低饱和）</text>
  <text x="295" y="32" text-anchor="middle" font-size="11" fill="#fff">30% 辅色</text>
  <text x="371" y="32" text-anchor="middle" font-size="10" fill="#fff">10%</text>
  <text x="352" y="58" font-size="10" fill="#EA580C">10% 强调色（按钮、链接，醒目因为它少）</text>
</svg>
