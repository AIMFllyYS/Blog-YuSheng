<svg viewBox="0 0 400 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">色相角度连续谱</title>
  <desc id="desc">从零度红色开始，依次经过黄色、绿色、青色、蓝色和品红色，三百六十度回到红色。</desc>
  <defs>
    <linearGradient id="huebar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF0000"/><stop offset="0.167" stop-color="#FFFF00"/>
      <stop offset="0.333" stop-color="#00FF00"/><stop offset="0.5" stop-color="#00FFFF"/>
      <stop offset="0.667" stop-color="#0000FF"/><stop offset="0.833" stop-color="#FF00FF"/>
      <stop offset="1" stop-color="#FF0000"/>
    </linearGradient>
  </defs>
  <rect x="20" y="20" width="360" height="26" rx="4" fill="url(#huebar)"/>
  <text x="20" y="62" font-size="10" fill="#333">0° 红</text>
  <text x="80" y="62" font-size="10" fill="#333">60° 黄</text>
  <text x="140" y="62" font-size="10" fill="#333">120° 绿</text>
  <text x="200" y="62" font-size="10" fill="#333">180° 青</text>
  <text x="260" y="62" font-size="10" fill="#333">240° 蓝</text>
  <text x="320" y="62" font-size="10" fill="#333">300° 品红</text>
  <text x="20" y="95" font-size="11" fill="#7C3AED">色相（Hue）= 色轮角度：六个锚点记住，HSL 数值心算可知颜色</text>
</svg>
