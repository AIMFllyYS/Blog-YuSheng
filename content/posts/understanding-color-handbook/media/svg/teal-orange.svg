<svg viewBox="0 0 400 190" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">橙青对比示意</title>
  <desc id="desc">色轮上相距一百八十度的橙色与青色形成补色关系，可用来分离肤色和背景。</desc>
  <circle cx="200" cy="90" r="70" fill="none" stroke="#D8D8D3" stroke-width="1"/>
  <circle cx="270" cy="90" r="16" fill="#F4A261"/>
  <text x="270" y="94" text-anchor="middle" font-size="9" fill="#57320F">橙 · 肤色</text>
  <circle cx="130" cy="90" r="16" fill="#2A9D8F"/>
  <text x="130" y="94" text-anchor="middle" font-size="9" fill="#fff">青 · 背景</text>
  <line x1="146" y1="90" x2="254" y2="90" stroke="#DC2626" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="200" y="82" text-anchor="middle" font-size="9" fill="#DC2626">色轮相距 180°（补色）</text>
  <text x="200" y="178" text-anchor="middle" font-size="10" fill="#666">阴影推青 + 肤色保橙 = 人脸自动“跳”出画面</text>
</svg>
