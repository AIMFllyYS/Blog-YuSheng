<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>文章包内验收卡片</title>
    <style>
      :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f3eeff; color: #2d2445; }
      main { width: min(28rem, calc(100% - 2rem)); padding: 1.5rem; border: 1px solid #aa98e8; border-radius: 1rem; background: #fff; box-shadow: 0 1rem 3rem rgb(75 52 130 / 14%); }
      h1 { margin: 0 0 .65rem; font-size: 1.25rem; }
      p { margin: 0; line-height: 1.7; }
    </style>
  </head>
  <body>
    <main>
      <h1>HTML Embed 已隔离</h1>
      <p>这段内容来自文章包内的独立小页，只用于验证 sandbox iframe 路径。</p>
    </main>
    <script>
      (() => {
        const nonce = new URLSearchParams(location.hash.slice(1)).get('nonce')
        if (!nonce) return
        parent.postMessage(
          { nonce: `${nonce}-invalid`, message: { type: 'ready' } },
          '*',
        )
        parent.postMessage({ nonce, message: { type: 'ready' } }, '*')
        const reportHeight = () => {
          parent.postMessage(
            { type: 'resize', height: document.documentElement.scrollHeight },
            '*',
          )
        }
        requestAnimationFrame(reportHeight)
        new ResizeObserver(reportHeight).observe(document.documentElement)
      })()
    </script>
  </body>
</html>
